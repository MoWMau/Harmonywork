<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Harmony Workbook</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Pantone-inspired refined palette */
  --bg:#f6f4f0;                 /* Pantone 11-0602 Whisper White-ish neutral */
  --surf:#ffffff;--surf2:#fbfaf7;--brd:#e4ded2;
  --ink:#2b2926;--mut:#8a8377;
  --acc:#20406b;--acl:#e3e9f2;          /* H1&2 — Pantone 19-4framework Classic Blue, muted */
  --h3:#8a6a54;--h3l:#efe6dd;           /* H3 — Pantone 17-1230 Mocha Mousse */
  --h4:#7a3b52;--h4l:#f1e3e8;           /* H4 — Pantone Viva Magenta, dialed down */
  --ok:#3f6e52;--okl:#e3ede6;--err:#a13d3d;--errl:#f4e3e2;
  --gold:#b08d57;--flame:#a1673a;
  --ph:126px;--hh:56px;--sw:260px;--rad:14px;
}
html{font-size:20px}
body{font-family:'Pretendard','Noto Sans KR',-apple-system,Georgia,serif;
  background:var(--bg);color:var(--ink);font-size:21px;-webkit-font-smoothing:antialiased}
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hh);
  background:#20263a;color:#f4f1ea;
  display:flex;align-items:center;padding:0 12px;gap:8px;z-index:200;
  box-shadow:0 2px 10px rgba(0,0,0,.18)}
#hdr h1{font-size:.96rem;flex:1;line-height:1.25;min-width:0;font-weight:600;letter-spacing:.01em}
#hdr h1 small{font-size:.72rem;opacity:.6;font-weight:400;display:block}
.hbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#f4f1ea;
  padding:6px 11px;border-radius:8px;cursor:pointer;font-size:.8rem;white-space:nowrap;
  transition:background .12s}
.hbtn:hover{background:rgba(255,255,255,.16)}
.hbtn.ext{background:var(--h3);border:none;font-weight:600;color:#fff}
.hbtn.ext:hover{background:#6f5744}
.xpwrap{display:flex;align-items:center;gap:6px;font-size:.76rem;white-space:nowrap;
  background:rgba(255,255,255,.08);padding:4px 10px;border-radius:20px}
.xpwrap b{color:#e8c98c}
#pbarwrap{position:fixed;top:var(--hh);left:0;right:0;height:4px;background:rgba(0,0,0,.05);z-index:190}
#pbar{height:100%;width:0%;background:linear-gradient(90deg,var(--acc),var(--h3));
  transition:width .4s ease}
#lay{display:flex;margin-top:calc(var(--hh) + 4px);margin-bottom:var(--ph);min-height:calc(100vh - var(--hh) - var(--ph) - 4px)}
#sb{width:var(--sw);background:var(--surf2);border-right:1px solid var(--brd);overflow-y:auto;
  position:fixed;top:calc(var(--hh) + 4px);bottom:var(--ph);left:0;z-index:150;padding:8px 0}
.sbgrp{font-size:.68rem;font-weight:700;letter-spacing:.08em;color:var(--mut);
  padding:14px 14px 4px;text-transform:uppercase}
.sbgrp.h3{color:var(--h3)}
.sbgrp.h4{color:var(--h4)}
.cbtn{display:block;width:calc(100% - 12px);margin:2px 6px;padding:9px 11px;text-align:left;
  border:none;border-radius:9px;background:transparent;cursor:pointer;font-size:.88rem;
  line-height:1.3;font-family:inherit;color:var(--ink);transition:background .12s}
.cbtn:hover{background:#eee8db}
.cbtn.act{background:var(--acl);color:var(--acc);font-weight:700}
.cbtn.act.h3{background:var(--h3l);color:var(--h3)}
.cbtn.act.h4{background:var(--h4l);color:var(--h4)}
.cbtn .pg{font-size:.72rem;color:var(--mut);display:block;margin-top:1px;font-weight:400}
.cbtn .cp{float:right;font-size:.72rem;color:var(--mut)}
.cbtn .badge100{color:var(--gold)}
#mn{flex:1;margin-left:var(--sw);padding:18px 18px 30px;max-width:900px}
.chdr{padding:12px 16px;border-radius:var(--rad);margin-bottom:16px;
  background:var(--surf);border:1px solid var(--brd);border-left:4px solid var(--acc)}
.chdr.h3{border-left-color:var(--h3)}
.chdr.h4{border-left-color:var(--h4)}
.chdr h2{font-size:1.22rem;color:var(--acc);margin-bottom:2px;font-weight:700}
.chdr.h3 h2{color:var(--h3)}
.chdr.h4 h2{color:var(--h4)}
.chdr p{font-size:.84rem;color:var(--mut)}
.chdr .links{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;padding:4px 10px;
  border-radius:16px;text-decoration:none;font-weight:600;border:1px solid transparent}
.chip.term{background:var(--h3l);color:var(--h3);border-color:#ddc9b8}
.chip.week{background:var(--h4l);color:var(--h4);border-color:#e0c3cd}
.pb{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rad);
  padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(40,30,10,.04)}
.pb.solved{border-left:4px solid var(--ok);background:linear-gradient(90deg,var(--okl) 0%,var(--surf) 3%)}
.pb.solved .pnum::after{content:' ✓';color:var(--ok);font-weight:700}
.pnum{font-size:.7rem;color:var(--mut);margin-bottom:4px;font-weight:600}
.pq{display:block;font-size:1.0rem;margin-bottom:10px;line-height:1.5}
.pq .en{display:block;font-size:.82rem;color:var(--mut);margin-top:2px}
.sw{overflow-x:auto;margin:6px 0}
svg.ssv{width:125%;height:auto;display:block}
.mco{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mo{padding:9px 15px;border-radius:10px;border:1.5px solid var(--brd);background:var(--surf2);
  cursor:pointer;font-size:.9rem;font-family:inherit;transition:all .12s;color:var(--ink)}
.mo:hover{border-color:var(--acc)}
.mo.ok{background:var(--okl);border-color:var(--ok);color:#274a37;font-weight:700}
.mo.bad{background:var(--errl);border-color:var(--err);color:#6b2a2a}
.ar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ai{flex:1;min-width:140px;padding:9px 12px;border:1.5px solid var(--brd);border-radius:9px;
  font-size:.94rem;font-family:inherit;background:var(--surf2)}
.ai:focus{outline:none;border-color:var(--acc)}
.btn{padding:9px 15px;border-radius:9px;border:none;cursor:pointer;font-size:.86rem;
  font-family:inherit;font-weight:600;transition:opacity .12s}
.btn:hover{opacity:.88}
.bp{background:var(--acc);color:#fff}
.bs{background:#e9e2d2;color:#4a4034}
.bc{background:#ecdcdb;color:#6b2a2a}
.bpl{background:var(--h3);color:#fff}
.fb{margin-top:10px;padding:9px 13px;border-radius:9px;font-size:.88rem;font-weight:600;display:none}
.fb.fok{display:block;background:var(--okl);color:#274a37}
.fb.fno{display:block;background:var(--errl);color:#6b2a2a}
.fb.fin{display:block;background:#f2ead9;color:#5c4a2e}
.why{margin-top:8px;padding:9px 13px;border-radius:9px;background:#f7f2e8;
  border:1px dashed #d9c9a8;font-size:.84rem;color:#5c4a2e;line-height:1.5}
.abar{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}
.ahl{font-size:.78rem;color:var(--mut);margin-right:2px}
.ab{width:29px;height:29px;border-radius:7px;border:1.5px solid var(--brd);background:var(--surf2);
  cursor:pointer;font-size:1rem}
.ab.sl{background:var(--acl);border-color:var(--acc)}
.nti{flex:1;min-width:120px;padding:7px 10px;border:1.5px solid var(--brd);border-radius:8px;font-size:.84rem;background:var(--surf2)}
.pnav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}
#pia{position:fixed;bottom:0;left:0;right:0;background:var(--surf2);
  border-top:1px solid var(--brd);z-index:180;padding:6px 0 4px;text-align:center}
#pia_lbl{font-size:.72rem;color:var(--mut);margin-bottom:2px}
#psvg{overflow-x:auto}
#streaktoast{position:fixed;top:70px;left:50%;transform:translateX(-50%) scale(.8);
  background:var(--h3);color:#fff;padding:8px 18px;
  border-radius:24px;font-weight:700;font-size:.92rem;box-shadow:0 6px 18px rgba(0,0,0,.2);
  z-index:400;opacity:0;pointer-events:none;transition:all .3s}
#streaktoast.show{opacity:1;transform:translateX(-50%) scale(1)}
#sbovl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:140}
@media(max-width:820px){
  :root{--sw:78vw}
  #sb{transform:translateX(-100%);transition:transform .22s;box-shadow:4px 0 24px rgba(0,0,0,.18)}
  #sb.open{transform:translateX(0)}
  #sbovl.open{display:block}
  #mn{margin-left:0;padding:14px 12px 26px}
  #hdr h1{font-size:.82rem}
  #hdr h1 small{font-size:.64rem}
  .hbtn{padding:5px 8px;font-size:.72rem}
  .xpwrap{font-size:.68rem;padding:3px 7px}
  .chdr h2{font-size:1.04rem}
  .mo{padding:8px 12px;font-size:.84rem}
  .pq{font-size:.94rem}
}
</style>
</head>
<body>
<div id="hdr">
  <h1>Harmony Workbook <small>화성학 워크북 인터랙티브</small></h1>
  <span class="xpwrap">⭐<b id="xpv">0</b> XP · 🔥<b id="streakv">0</b></span>
  <a class="hbtn ext" href="https://mowmau.github.io/harmony/#glossary" target="_blank" rel="noopener">📖 용어사전</a>
  <a class="hbtn ext" href="https://mowmau.github.io/harmony/#home" target="_blank" rel="noopener">🎓 강좌</a>
  <button class="hbtn" onclick="A.lang()">한/EN</button>
  <button class="hbtn" onclick="A.toggleSB()">☰</button>
</div>
<div id="pbarwrap"><div id="pbar"></div></div>
<div id="sbovl" onclick="A.toggleSB()"></div>
<div id="lay">
  <aside id="sb"><div id="chl"></div></aside>
  <main id="mn">
    <div class="chdr" id="chdr">
      <h2 id="cht"></h2><p id="chd"></p>
      <div class="links" id="chlinks"></div>
    </div>
    <div id="pbs"></div>
    <div class="pnav">
      <button class="btn bs" onclick="A.prev()">← 이전 챕터</button>
      <span id="pct" style="color:var(--mut);font-size:.84rem"></span>
      <button class="btn bs" onclick="A.next()">다음 챕터 →</button>
    </div>
  </main>
</div>
<div id="streaktoast"></div>
<div id="pia"><div id="pia_lbl">🎹 쓰기 문제의 오선을 클릭하면 건반 연동</div><div id="psvg"></div></div>
<script>
'use strict';
'use strict';
/* ═══════════════════════════════════════════════
   MUSIC THEORY ENGINE
═══════════════════════════════════════════════ */
const NL=['C','D','E','F','G','A','B'];
const SC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function pn(s){const m=s.match(/^([A-G])([#b]*)(\d+)$/);if(!m)return null;return{n:m[1],a:m[2],o:+m[3]};}
function midi(s){const v=pn(s);if(!v)return null;let sm=SC[v.n];for(const c of v.a)sm+=c==='#'?1:-1;return 12*(v.o+1)+sm;}
function freq(s){const m=midi(s);return m?440*Math.pow(2,(m-69)/12):440;}
function ds(s){const v=pn(s);if(!v)return 0;return NL.indexOf(v.n)+(v.o-4)*7;}
function sy(step,cl){return cl==='bass'?50-5*step:110-5*step;}
function ys(y,cl){return cl==='bass'?Math.round((50-y)/5):Math.round((110-y)/5);}
function snn(step){const o=4+Math.floor(step>=0?Math.floor(step/7):(step-6)/7|0);const base=((step%7)+7)%7;return NL[base]+o;}
function leg(step,cl){const[lo,hi]=cl==='bass'?[-10,-2]:[2,10];const r=[];
  if(step<lo){for(let s=lo-2;s>=step-((step%2+2)%2);s-=2)r.push(s);}
  else if(step>hi){for(let s=hi+2;s<=step+((step%2+2)%2);s+=2)r.push(s);}
  return r;}
const ACC={'#':'♯','b':'♭','n':'♮','##':'𝄪','bb':'𝄫','':''};

/* ═══════════════════════════════════════════════
   WEB AUDIO
═══════════════════════════════════════════════ */
let AX=null;
function ax(){if(!AX)AX=new(window.AudioContext||window.webkitAudioContext)();if(AX.state==='suspended')AX.resume();return AX;}
function pnote(f,when=0,dur=0.65,vol=0.38){
  try{const c=ax(),t=c.currentTime+when;
  const o=c.createOscillator(),g=c.createGain();
  o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.022);
  g.gain.exponentialRampToValueAtTime(vol*.45,t+.1);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur);}catch(e){}
}
function play(ns,dl=0.18){ns.forEach((n,i)=>setTimeout(()=>pnote(freq(n),0,.6),i*dl*1000));}
function playchord(ns){ns.forEach(n=>pnote(freq(n),0,.9,.28));}
function flash(ns){ns.forEach((n,i)=>{setTimeout(()=>{
  const m=midi(n);if(!m)return;
  const el=document.querySelector(`[data-m="${m}"]`);
  if(el){el.classList.add('pk');setTimeout(()=>el.classList.remove('pk'),480);}
},i*160);});}

/* ═══════════════════════════════════════════════
   STAFF SVG
═══════════════════════════════════════════════ */
const KST=[10,7,11,8,5,9,6]; // treble sharp steps
const KSB=[8,5,9,6,3,7,4];  // bass sharp steps
const KFT=[6,9,5,8,4,7,3];  // treble flat steps
const KFB=[4,7,3,6,2,5,1];  // bass flat steps

// 검증된 참고 구현을 이식: 임시표를 폰트 없이 LG(줄간격) 비례로 직접 그림.
// rEdge=기호 오른쪽 끝(음표 머리 왼쪽에 붙임), cy=세로 중심(=음표/줄 y좌표)
const ACC_LG=11;
function accSVG(rEdge,cy,acc,color){
  const LG=ACC_LG,col=color||'#1a1a1a';
  const sw=Math.max(1.4,LG*0.13);
  function flatPath(edge){
    const stemTop=cy-LG*1.05;
    const bx=edge-LG*0.52;
    const bellMidY=cy+LG*0.10;
    const bellTopY=cy-LG*0.30;
    const bellBotY=cy+LG*0.50;
    const bellRX=edge;
    return `<path d="M ${bx} ${stemTop} L ${bx} ${bellBotY+LG*0.05} `
      +`M ${bx} ${bellTopY} Q ${bellRX+LG*0.06} ${bellTopY+LG*0.04} ${bellRX-LG*0.02} ${bellMidY} `
      +`Q ${bellRX-LG*0.10} ${bellBotY-LG*0.02} ${bx} ${bellBotY}" `
      +`fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  if(acc==='#'){
    const w=LG*0.62,h=LG*1.55;
    const xL=rEdge-w,xR=rEdge;
    const vx1=xL+w*0.34,vx2=xL+w*0.70;
    const yTop=cy-h/2,yBot=cy+h/2;
    const hUp=cy-LG*0.30,hDn=cy+LG*0.30;
    return `<g stroke="${col}" stroke-width="${sw}" stroke-linecap="square">`
      +`<line x1="${vx1}" y1="${yTop+LG*0.18}" x2="${vx1}" y2="${yBot}"/>`
      +`<line x1="${vx2}" y1="${yTop}" x2="${vx2}" y2="${yBot-LG*0.18}"/>`
      +`<line x1="${xL}" y1="${hUp+LG*0.10}" x2="${xR}" y2="${hUp-LG*0.10}" stroke-width="${sw*1.7}"/>`
      +`<line x1="${xL}" y1="${hDn+LG*0.10}" x2="${xR}" y2="${hDn-LG*0.10}" stroke-width="${sw*1.7}"/></g>`;
  }
  if(acc==='b'){
    return flatPath(rEdge);
  }
  if(acc==='bb'){
    // two flat bells, closely nested — the right one sits against the note, the left one just behind it
    return flatPath(rEdge)+flatPath(rEdge-LG*0.66);
  }
  if(acc==='##'||acc==='x'){
    // double-sharp: a bold "×" with small diamond accents, per common notation practice
    const r=LG*0.42,cx2=rEdge-LG*0.55;
    return `<g stroke="${col}" stroke-width="${sw*1.3}" stroke-linecap="round">`
      +`<line x1="${cx2-r}" y1="${cy-r}" x2="${cx2+r}" y2="${cy+r}"/>`
      +`<line x1="${cx2-r}" y1="${cy+r}" x2="${cx2+r}" y2="${cy-r}"/></g>`;
  }
  if(acc==='n'){
    const w=LG*0.5,h=LG*1.5;
    const xL=rEdge-w,xR=rEdge,yT=cy-h/2,yB=cy+h/2;
    return `<g stroke="${col}" stroke-width="${sw}" stroke-linecap="square" fill="none">`
      +`<line x1="${xL}" y1="${yT}" x2="${xL}" y2="${cy+LG*0.35}"/>`
      +`<line x1="${xR}" y1="${cy-LG*0.35}" x2="${xR}" y2="${yB}"/>`
      +`<line x1="${xL}" y1="${cy-LG*0.32}" x2="${xR}" y2="${cy-LG*0.52}" stroke-width="${sw*1.7}"/>`
      +`<line x1="${xL}" y1="${cy+LG*0.52}" x2="${xR}" y2="${cy+LG*0.32}" stroke-width="${sw*1.7}"/></g>`;
  }
  const ac=ACC[acc]||acc;
  return `<text x="${rEdge-8}" y="${cy+6}" font-size="16" fill="${col}" font-family="serif" text-anchor="middle">${ac}</text>`;
}

function drawStaff(opt){
  const{cl='treble',ns=[],w=520,inter=false,id='',ks=0,kf=0}=opt;
  const H=200;let sx=54;
  // width+height 명시 → 브라우저 크기0 버그 방지
  let o=`<svg ${id?`id="${id}" `:''}width="${w}" height="${H}" viewBox="0 0 ${w} ${H}" class="ssv${inter?' ck':''}" xmlns="http://www.w3.org/2000/svg"${inter?` data-cl="${cl}" data-i="1"`:''}>`;
  o+=`<rect width="${w}" height="${H}" fill="white"/>`;
  for(let i=0;i<5;i++){const y=60+i*10;o+=`<line x1="8" y1="${y}" x2="${w-8}" y2="${y}" stroke="#1a1a1a" stroke-width="1.4"/>`;}
  if(cl==='treble'){
    // 높은음자리표: G선(y=90) 기준 — 검증된 참고 구현의 비례식(fs=staffH*2.10, baseline=gY+fs*0.185)을
    // 우리 좌표계(staffH=40, G선 y=90)에 대입해 계산한 값
    o+=`<text x="10" y="105.7" font-size="85" font-family="'Bravura','Noto Music','Segoe UI Symbol',serif" fill="#1a1a1a">𝄞</text>`;
    sx=54;
  } else {
    // 낮은음자리표: F선(y=70) 기준 — 참고 구현의 비례식(fs=staffH*1.28, baseline=fY+fs*0.46) 그대로 적용.
    // 점은 글자 자체에 포함된 것을 그대로 사용 (별도로 그리지 않음 — 중복 방지)
    o+=`<text x="10" y="94.0" font-size="52.2" font-family="'Bravura','Noto Music','Segoe UI Symbol',serif" fill="#1a1a1a">𝄢</text>`;
    sx=48;
  }
  if(ks>0){const arr=cl==='bass'?KSB:KST;for(let i=0;i<ks;i++){const y=sy(arr[i],cl);o+=accSVG(sx+8+i*11,y,'#');}sx+=ks*11+8;}
  if(kf>0){const arr=cl==='bass'?KFB:KFT;for(let i=0;i<kf;i++){const y=sy(arr[i],cl);o+=accSVG(sx+8+i*10,y,'b');}sx+=kf*10+8;}
  for(const n of ns)o+=drawNote(n,cl);
  o+='</svg>';return o;
}
function grandStaff(trebleNotes,bassNote,w=220,trebleColor='#1a1a1a',bassColor='#7a3b52'){
  // Standard polychord/upper-structure engraving: upper chord stacked in the treble staff,
  // the lower chord's root shown as a single note in the bass staff underneath.
  const top=drawStaff({cl:'treble',ns:trebleNotes.map(n=>({note:n,acc:'',color:trebleColor,style:'whole',x:90})),w});
  const bot=drawStaff({cl:'bass',ns:[{note:bassNote,acc:'',color:bassColor,style:'whole',x:90}],w});
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:-6px;">${top}${bot}</div>`;
}
function drawNote(n,cl){
  const{note,acc,color='#1a1a1a',style='whole',x=140}=typeof n==='object'?n:{note:n,acc:'',color:'#1a1a1a',style:'whole',x:140};
  const step=ds(note);const y=sy(step,cl);let o='';
  const ls=leg(step,cl);
  for(const l of ls){const ly=sy(l,cl);o+=`<line x1="${x-13}"y1="${ly}"x2="${x+13}"y2="${ly}"stroke="#1a1a1a"stroke-width="1.2"/>`;}
  const ra=acc||(pn(note)?.a||'');
  if(ra){o+=accSVG(x-6.5-0.6,y,ra,color);}
  const mid=cl==='treble'?6:-4;const up=step<mid;

  o+=`<ellipse cx="${x}"cy="${y}"rx="6.5"ry="4.5"fill="${color}"transform="rotate(-18,${x},${y})"/>`;

    const ex=up?x+6:x-6;o+=`<line x1="${ex}"y1="${y}"x2="${ex}"y2="${y+(up?-30:30)}"stroke="${color}"stroke-width="1.5"/>`;
  }
  return o;
}

function mkPiano(){
  const WW=22,WH=80,BW=14,BH=48;
  const OCTS=[3,4,5];
  let whites=[],blacks=[],wi=0;
  for(const oct of OCTS){
    for(let d=0;d<7;d++){
      const note=NL[d]+oct,m=midi(note),x=wi*WW;
      whites.push(`<rect data-m="${m}"class="pkw"x="${x+1}"y="2"width="${WW-2}"height="${WH}"rx="2"fill="#fefefe"stroke="#888"stroke-width="1"style="cursor:pointer"onclick="A.pk('${note}')"/>`);
      if(d===0)whites.push(`<text x="${x+WW/2}"y="${WH-4}"text-anchor="middle"font-size="7"fill="#888"pointer-events="none">C${oct}</text>`);
      wi++;
    }
  }
  wi=0;
  for(const oct of OCTS){
    const hb=[1,1,0,1,1,1,0],bn=['C#','D#','','F#','G#','A#',''];
    for(let d=0;d<7;d++){
      if(hb[d]){const note=bn[d]+oct,m=midi(note),x=wi*WW+WW*.62;blacks.push(`<rect data-m="${m}"class="pkb"x="${x}"y="2"width="${BW}"height="${BH}"rx="2"fill="#1a1a1a"stroke="#333"stroke-width="1"style="cursor:pointer"onclick="A.pk('${note}')"/>`);}
      wi++;
    }
  }
  const tot=OCTS.length*7*WW+4;
  document.getElementById('psvg').innerHTML=`<svg width="${tot}"height="${WH+10}"xmlns="http://www.w3.org/2000/svg"style="display:block"><style>.pkw:hover{fill:#e8f4ff}.pk{fill:#93c5fd!important}.pkb:hover{fill:#334}.pkb.pk{fill:#1d4ed8!important}</style>${whites.join('')}${blacks.join('')}</svg>`;
}

function shuf(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function oKs(ex,n=3){return shuf(['C major','G major','D major','A major','E major','F major','Bb major','Eb major','Ab major','Db major','F# major','A minor','E minor','B minor','D minor','G minor','C minor'].filter(k=>k!==ex)).slice(0,n);}
function mkOpts(ans,pool,n=4){const distract=shuf(pool.filter(x=>x!==ans)).slice(0,n-1);return shuf([ans,...distract]);}
function sameRootOpts(ans,qualityList,maxDistract=999){
  // ans = "ROOT quality" (e.g. "D dorian","C aug"). Distractors share the SAME root,
  // differing only in quality — so the visible root on the staff can't give the answer away.
  const sp=ans.indexOf(' ');const root=ans.slice(0,sp);const qual=ans.slice(sp+1);
  const distractQ=shuf(qualityList.filter(q=>q!==qual)).slice(0,maxDistract);
  return shuf([ans,...distractQ.map(q=>root+' '+q)]);
}
function sameRoot7Opts(lbl){
  // lbl = "ROOTquality7" (e.g. "Bm7b5","Cdim7","G7"). Same-root distractors across the
  // 5 seventh-chord qualities taught in this chapter.
  const Q7=['maj7','m7','7','m7b5','dim7'];
  const m=lbl.match(/^[A-G][#b]?/);const root=m[0];const qual=lbl.slice(root.length);
  const distract=Q7.filter(q=>q!==qual).map(q=>root+q);
  return shuf([lbl,...distract]);
}

function oIn(ex,n=4){return mkOpts(ex,['P5','M3','m3','M6','m6','P4','M7','m7','A4','d5','m2','M2','P8','A5','d7'],n);}
function oCh(ex,n=4){return shuf(['C major','D minor','E minor','F major','G major','A minor','B dim','C minor','D major','E major','F minor','G aug','D aug','C aug','Eb major','Bb major','Ab major'].filter(c=>c!==ex)).slice(0,n);}
function oMo(ex,n=4){return mkOpts(ex,['D dorian','G mixolydian','E phrygian','A lydian','B locrian','C aeolian','F dorian','Bb mixolydian','A phrygian','D mixolydian','C ionian','F lydian'],n);}


/* ═══════════════════════════════════════════════
   MICROPHONE PITCH DETECTION — sing or play the answer
═══════════════════════════════════════════════ */
const MIDI_NAMES_SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function midiToNoteName(m){
  const oct=Math.floor(m/12)-1;
  const name=MIDI_NAMES_SHARP[((m%12)+12)%12];
  return name+oct;
}
function freqToMidi(f){ return 69+12*Math.log2(f/440); }
function centsOff(detectedFreq,targetFreq){ return 1200*Math.log2(detectedFreq/targetFreq); }
// Is the detected frequency within +/-25 cents of the given target note?
// 25 cents = a quarter of a half step, so this requires real pitch accuracy,
// not just "closest to the right semitone" (which would allow up to 49 cents off).
function pitchMatchesNote(detectedFreq,targetNote,toleranceCents=25){
  const targetFreq=freq(targetNote);
  if(!targetFreq)return false;
  const cents=centsOff(detectedFreq,targetFreq);
  return Math.abs(cents)<=toleranceCents;
}
// Autocorrelation-based pitch detector (time-domain buffer -> frequency in Hz, or -1 if no clear pitch)
function autoCorrelate(buf,sampleRate){
  const SIZE=buf.length;
  let rms=0;
  for(let i=0;i<SIZE;i++){ rms+=buf[i]*buf[i]; }
  rms=Math.sqrt(rms/SIZE);
  if(rms<0.01) return -1; // too quiet
  let r1=0,r2=SIZE-1;
  const thres=0.2;
  for(let i=0;i<SIZE/2;i++){ if(Math.abs(buf[i])<thres){ r1=i; break; } }
  for(let i=1;i<SIZE/2;i++){ if(Math.abs(buf[SIZE-i])<thres){ r2=SIZE-i; break; } }
  const trimmed=buf.slice(r1,r2);
  const newSize=trimmed.length;
  const c=new Array(newSize).fill(0);
  for(let lag=0;lag<newSize;lag++){
    let sum=0;
    for(let i=0;i<newSize-lag;i++){ sum+=trimmed[i]*trimmed[i+lag]; }
    c[lag]=sum;
  }
  let d=0; while(d<newSize-1 && c[d]>c[d+1]) d++;
  let maxVal=-1,maxPos=-1;
  for(let i=d;i<newSize;i++){ if(c[i]>maxVal){ maxVal=c[i]; maxPos=i; } }
  let T0=maxPos;
  if(T0<=0) return -1;
  const x1=c[T0-1]||0,x2=c[T0],x3=c[T0+1]||0;
  const a=(x1+x3-2*x2)/2, b=(x3-x1)/2;
  if(a) T0=T0-b/(2*a);
  return sampleRate/T0;
}
let MIC_STATE={active:false,stream:null,ctx:null,analyser:null,raf:null,pid:null,history:[]};
async function micStop(){
  if(MIC_STATE.raf) cancelAnimationFrame(MIC_STATE.raf);
  if(MIC_STATE.stream) MIC_STATE.stream.getTracks().forEach(t=>t.stop());
  if(MIC_STATE.ctx && MIC_STATE.ctx.state!=='closed') { try{await MIC_STATE.ctx.close();}catch(e){} }
  MIC_STATE={active:false,stream:null,ctx:null,analyser:null,raf:null,pid:null,history:[]};
}
async function micStart(pid,onDetect,onLive){
  await micStop();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser();
    analyser.fftSize=2048;
    src.connect(analyser);
    MIC_STATE={active:true,stream,ctx,analyser,raf:null,pid,history:[]};
    const buf=new Float32Array(analyser.fftSize);
    let firedFor=null; // avoid re-firing onDetect repeatedly while a note is held
    const loop=()=>{
      if(!MIC_STATE.active)return;
      analyser.getFloatTimeDomainData(buf);
      const f=autoCorrelate(buf,ctx.sampleRate);
      if(f>0 && f<2000){
        const m=Math.round(freqToMidi(f));
        const name=midiToNoteName(m);
        MIC_STATE.history.push({name,freq:f});
        if(MIC_STATE.history.length>60)MIC_STATE.history.shift();
        if(onLive)onLive(name,f);
        // stability check: same note held for ~15 consecutive frames (~0.25s at 60fps).
        // Once stable, average the frequency across that window -- this smooths out
        // natural vibrato/mic noise so the +/-25 cent accuracy check is meaningful
        // rather than being tripped up by a single noisy instant.
        const recent=MIC_STATE.history.slice(-15);
        if(recent.length===15 && recent.every(x=>x.name===recent[0].name)){
          if(firedFor!==recent[0].name){
            firedFor=recent[0].name;
            const avgFreq=recent.reduce((s,x)=>s+x.freq,0)/recent.length;
            if(onDetect)onDetect(recent[0].name,avgFreq);
          }
        }else{
          firedFor=null;
        }
      }else if(onLive){ onLive(null,0); firedFor=null; }
      MIC_STATE.raf=requestAnimationFrame(loop);
    };
    loop();
  }catch(e){
    if(onLive)onLive('__ERROR__',0);
  }
}

function mkProbs(){
  const ps=[];let idx=0;
  function add(o){ps.push({id:'p'+(++idx),...o});return ps[ps.length-1];}

  /* ── CH 0: Pitch Recognition ── */
  const trebleNotes=['E4','G4','B4','D5','F5','F4','A4','C5','C4','D4','B3','A3',
                     'F#4','Bb4','C#5','Eb4','G#4','D#5','Ab3','Gb4','E5','Db4'];
  trebleNotes.forEach(n=>{
    const s=drawStaff({cl:'treble',ns:[{note:n,acc:'',color:'#1a1a1a',style:'whole',x:160}],w:300});
    add({ch:0,type:'id',q:{ko:'이 음표의 이름은? (예: F#4)',en:'Name this note (e.g., F#4):'},staff:s,audio:[n],ans:n,check:a=>midi(a.trim())===midi(n)});
  });
  const bassNotes=['G2','B2','D3','F3','A3','A2','C3','E3','G3','F2','E2','C4',
                   'F#3','Bb2','Eb3','C#3','Ab3','G#2','D#3','Db3'];
  bassNotes.forEach(n=>{
    const s=drawStaff({cl:'bass',ns:[{note:n,acc:'',color:'#1a1a1a',style:'whole',x:160}],w:300});
    add({ch:0,type:'id',q:{ko:'이 음표의 이름은?',en:'Name this note:'},staff:s,audio:[n],ans:n,check:a=>midi(a.trim())===midi(n)});
  });

  /* ── CH 1: Accidentals & Enharmonics ── */
  const enharPairs=[['F#4','Gb4'],['C#4','Db4'],['G#4','Ab4'],['D#4','Eb4'],['A#4','Bb4'],
                    ['E#4','F4'],['B#4','C5'],['Cb4','B3'],['Fb4','E4'],['C##4','D4'],['Bbb3','A3'],['Ebb4','D4'],
                    ['F##4','G4'],['G##4','A4'],['A##4','B4'],['Dbb4','C4'],['Abb3','G3'],['Gbb4','F4']];
  enharPairs.forEach(([a,b])=>{
    const s=drawStaff({cl:'treble',ns:[{note:a,acc:'',color:'#1a1a1a',style:'whole',x:160}],w:300});
    add({ch:1,type:'id',q:{ko:'이명동음을 쓰세요.',en:'Write the enharmonic equivalent:'},staff:s,audio:[a],ans:b,check:v=>midi(v.trim())===midi(a)});
  });

  /* ── CH 2: Major Scales ── */
  ['C maj','G maj','D maj','A maj','E maj','B maj','F# maj','Db maj','Ab maj','Eb maj','Bb maj','F maj'].forEach(k=>{
    const ns=SD[k];if(!ns)return;
    add({ch:2,type:'write',q:{ko:`${k} 장음계를 오선에 쓰세요.`,en:`Write the ${k} major scale:`},
      clef:'treble',given:[ns[0]],givenX:80,ans:ns,audio:ns});
  });

  /* ── CH 3: Minor Scales ── */
  [['A nat min','자연단조','natural minor'],['E nat min','자연단조','natural minor'],
   ['D nat min','자연단조','natural minor'],['G nat min','자연단조','natural minor'],
   ['C nat min','자연단조','natural minor'],['F nat min','자연단조','natural minor'],
   ['A harm min','화성단조','harmonic minor'],['E harm min','화성단조','harmonic minor'],
   ['D harm min','화성단조','harmonic minor'],['G harm min','화성단조','harmonic minor'],
   ['C harm min','화성단조','harmonic minor'],['F harm min','화성단조','harmonic minor'],
   ['A mel min','선율단조','melodic minor'],['E mel min','선율단조','melodic minor'],
   ['D mel min','선율단조','melodic minor'],['B mel min','선율단조','melodic minor'],
   ['C mel min','선율단조','melodic minor'],['F mel min','선율단조','melodic minor']].forEach(([k,kt,ke])=>{
    const ns=SD[k];if(!ns)return;
    add({ch:3,type:'write',q:{ko:`${k.split(' ')[0]} ${kt}을 쓰세요.`,en:`Write the ${k} (${ke}):`},
      clef:'treble',given:[ns[0]],givenX:80,ans:ns,audio:ns});
  });

  /* ── CH 4: Pentatonic ── */
  ['D maj pent','G maj pent','E maj pent','Bb maj pent','Db maj pent',
   'A min pent','E min pent','G min pent','F min pent'].forEach(k=>{
    const ns=SD[k];if(!ns)return;
    const type=k.includes('min')?'단5음음계/minor pentatonic':'장5음음계/major pentatonic';
    add({ch:4,type:'write',q:{ko:`${k} 5음음계를 쓰세요.`,en:`Write the ${k} pentatonic:`},
      clef:'treble',given:[ns[0]],givenX:80,ans:ns,audio:ns});
  });

  /* ── CH 5: Key Signatures ── */
  const ksSig=[
    {key:'G major',ks:1,kf:0},{key:'D major',ks:2,kf:0},{key:'A major',ks:3,kf:0},
    {key:'E major',ks:4,kf:0},{key:'B major',ks:5,kf:0},{key:'F# major',ks:6,kf:0},
    {key:'F major',ks:0,kf:1},{key:'Bb major',ks:0,kf:2},{key:'Eb major',ks:0,kf:3},
    {key:'Ab major',ks:0,kf:4},{key:'Db major',ks:0,kf:5},{key:'Gb major',ks:0,kf:6},
    {key:'E minor',ks:1,kf:0},{key:'B minor',ks:2,kf:0},{key:'D minor',ks:0,kf:1},
    {key:'G minor',ks:0,kf:2},{key:'C minor',ks:0,kf:3},{key:'F minor',ks:0,kf:4},
  ];
  function keyTonicTriad(key){
    const m=key.match(/^([A-G][#b]?) (major|minor)$/);
    const root=m[1], isMin=m[2]==='minor';
    const pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[root[0]]+(root[1]==='#'?1:root[1]==='b'?-1:0);
    const CHS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const CHF=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
    const flats=root.includes('b')||['F','Bb','Eb','Ab','Db','Gb'].includes(root);
    const third=isMin?3:4, fifth=7;
    const nm=(off)=>{
      const rawPc=((pc+off)%12+12)%12;
      const name=(flats?CHF:CHS)[rawPc];
      const oct=(off>0&&rawPc<((pc%12+12)%12))?5:4;
      return name+oct;
    };
    return [root+'4',nm(third),nm(fifth)];
  }
  ksSig.forEach(({key,ks,kf})=>{
    const s=drawStaff({cl:'treble',ns:[],w:180,ks,kf});
    const triad=keyTonicTriad(key);
    add({ch:5,type:'mc',q:{ko:'이 조표는 어느 조?',en:'Identify this key signature:'},
      staff:s,audio:triad,ans:key,opts:shuf([key,...oKs(key,3)]).slice(0,4)});
  });
  // Write how many sharps/flats
  [{key:'A major',val:'3 sharps',ks:3,kf:0},{key:'Bb major',val:'2 flats',ks:0,kf:2},{key:'E major',val:'4 sharps',ks:4,kf:0},
   {key:'Eb major',val:'3 flats',ks:0,kf:3},{key:'B major',val:'5 sharps',ks:5,kf:0},{key:'Ab major',val:'4 flats',ks:0,kf:4},
  ].forEach(({key,val,ks,kf})=>{
    const s=drawStaff({cl:'treble',ns:[],w:180,ks,kf});
    const triad=keyTonicTriad(key);
    add({ch:5,type:'analyze',q:{ko:`${key}: 조표에 #/b 몇 개?`,en:`${key}: how many sharps/flats?`},ans:val,staff:s,audio:triad});
  });

  /* ── CH 6: Intervals ── */
  const intPairs=[
    {ns:['C4','E4'],ans:'M3'},{ns:['C4','G4'],ans:'P5'},{ns:['C4','A4'],ans:'M6'},
    {ns:['C4','B4'],ans:'M7'},{ns:['D4','F4'],ans:'m3'},{ns:['D4','Ab4'],ans:'d5'},
    {ns:['F4','B4'],ans:'A4'},{ns:['G4','F5'],ans:'m7'},{ns:['C4','F4'],ans:'P4'},
    {ns:['C4','Db4'],ans:'m2'},{ns:['C4','D4'],ans:'M2'},{ns:['C4','Ab4'],ans:'m6'},
    {ns:['C4','Bb4'],ans:'m7'},{ns:['C4','C5'],ans:'P8'},{ns:['E4','G4'],ans:'m3'},
    {ns:['A3','C4'],ans:'m3'},{ns:['B3','D4'],ans:'m3'},{ns:['C4','F#4'],ans:'A4'},
    {ns:['E4','Bb4'],ans:'d5'},{ns:['A3','Eb4'],ans:'d5'},{ns:['G3','E4'],ans:'M6'},
    {ns:['D4','C5'],ans:'m7'},{ns:['F4','E5'],ans:'M7'},{ns:['Bb3','A4'],ans:'M7'},
  ];
  intPairs.forEach(({ns,ans})=>{
    const s=drawStaff({cl:'treble',ns:[{note:ns[0],acc:'',color:'#1a1a1a',style:'whole',x:110},{note:ns[1],acc:'',color:'#1a1a1a',style:'whole',x:170}],w:300});
    add({ch:6,type:'mc',q:{ko:'이 음정의 이름은?',en:'Name this interval:'},staff:s,audio:ns,ans,opts:oIn(ans)});
  });
  // Write interval above
  [{root:'C4',int:'M3',ans:'E4'},{root:'G3',int:'P5',ans:'D4'},{root:'F4',int:'M2',ans:'G4'},
   {root:'A3',int:'m3',ans:'C4'},{root:'D4',int:'M6',ans:'B4'},{root:'E4',int:'P4',ans:'A4'},
   {root:'B3',int:'m7',ans:'A4'},{root:'C4',int:'M7',ans:'B4'},{root:'F#4',int:'m3',ans:'A4'},
   {root:'Bb3',int:'M3',ans:'D4'},{root:'G4',int:'m6',ans:'Eb5'},{root:'D4',int:'A4',ans:'G#4'},
   {root:'C4',int:'m6',ans:'Ab4'},{root:'E4',int:'m2',ans:'F4'},{root:'A3',int:'M2',ans:'B3'},
  ].forEach(({root,int,ans})=>{
    add({ch:6,type:'write',q:{ko:`위로 ${int} 음정을 쓰세요.`,en:`Write a note ${int} above:`},
      clef:'treble',given:[root],givenX:100,ans:[ans],audio:[root,ans]});
  });
  // Write interval below
  [{root:'E4',int:'M3',ans:'C4'},{root:'A4',int:'P5',ans:'D4'},{root:'G4',int:'P4',ans:'D4'},
   {root:'F4',int:'m3',ans:'D4'},{root:'B4',int:'M6',ans:'D4'},{root:'D5',int:'M7',ans:'Eb4'},
   {root:'Bb4',int:'P5',ans:'Eb4'},{root:'G4',int:'m6',ans:'B3'},
  ].forEach(({root,int,ans})=>{
    add({ch:6,type:'write',q:{ko:`아래로 ${int} 음정을 쓰세요.`,en:`Write a note ${int} below:`},
      clef:'treble',given:[root],givenX:160,ans:[ans],audio:[ans,root]});
  });

  /* ── CH 7: Triads ── */
  const triadID=[
    {ns:['C4','E4','G4'],ans:'C major'},{ns:['D4','F4','A4'],ans:'D minor'},

  function ch12ChordSpell(sym,key){
    const m=sym.match(/^([A-G][#b]?)(maj7|m7b5|m7|7)$/);
    if(!m)return null;
    const root=m[1], qual=m[2];
    const pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[root[0]]+(root[1]==='#'?1:root[1]==='b'?-1:0);
    const CHS_=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const CHF_=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
    const flats=root.includes('b')||(key&&['F major','Bb major','Eb major','Ab major','Db major'].includes(key));
    const third=qual==='maj7'||qual==='7'?4:3;
    const fifth=qual==='m7b5'?6:7;
    const seventh=qual==='maj7'?11:10;
    return [0,third,fifth,seventh].map(off=>{
      const rawPc=((pc+off)%12+12)%12;
      const name=(flats?CHF_:CHS_)[rawPc];
      const oct=(off>0 && rawPc<((pc%12+12)%12))?5:4;
      return name+oct;
    });
  }

  add({ch:17,type:'mc',q:{ko:'다음 확장 도미넌트 사슬: E7 – A7 – D7 – G7 – C. A7의 로마숫자 기능은?',en:'In this extended dominant chain: E7 – A7 – D7 – G7 – C. What is the Roman-numeral function of A7?'},audio:[],ans:'V7/V/V',opts:["V7/V/V","V7/V","V7","V7/V/V/V"],terms:['extended_dominant'],why:{ko:'확장 도미넌트는 완전5도씩 사슬처럼 이어지는 도미넌트들입니다. 사슬을 목표(으뜸음)에서부터 거꾸로 세면 몇 단계 떨어져 있는지로 기능을 표시합니다.',en:'Extended dominants chain together in descending perfect 5ths. Count backward from the final target to see how many links away each chord is.'}});

  /* ── CH 18: Substitute Dominants / Tritone Sub (Harmony 3) ── */
  add({ch:18,type:'mc',q:{ko:'C7의 대리도미넌트(subV7)는?',en:'The substitute dominant (subV7) of C7 is:'},audio:[],ans:'Gb7',opts:["C#7","C7","Gb7","F7"],terms:['substitute_dominant','tritone'],why:{ko:'C7와 Gb7는 트라이톤(3온음)을 공유합니다. 그래서 서로의 대리 역할을 할 수 있고, 완전5도 대신 반음 아래로 해결합니다.',en:'C7 and Gb7 share the same tritone, so each can substitute for the other — resolving down a half step instead of a perfect 5th.'}});

  add({ch:18,type:'mc',q:{ko:'A7의 대리도미넌트(subV7)는?',en:'The substitute dominant (subV7) of A7 is:'},audio:[],ans:'Eb7',opts:["D7","Eb7","A7","A#7"],terms:['substitute_dominant','tritone'],why:{ko:'A7와 Eb7는 트라이톤(3온음)을 공유합니다. 그래서 서로의 대리 역할을 할 수 있고, 완전5도 대신 반음 아래로 해결합니다.',en:'A7 and Eb7 share the same tritone, so each can substitute for the other — resolving down a half step instead of a perfect 5th.'}});

  add({ch:18,type:'mc',q:{ko:'B7의 대리도미넌트(subV7)는?',en:'The substitute dominant (subV7) of B7 is:'},audio:[],ans:'F7',opts:["C7","E7","B7","F7"],terms:['substitute_dominant','tritone'],why:{ko:'B7와 F7는 트라이톤(3온음)을 공유합니다. 그래서 서로의 대리 역할을 할 수 있고, 완전5도 대신 반음 아래로 해결합니다.',en:'B7 and F7 share the same tritone, so each can substitute for the other — resolving down a half step instead of a perfect 5th.'}});
  add({ch:18,type:'mc',q:{ko:'대리도미넌트 Db7의 코드 스케일은?',en:'The chord scale for the substitute dominant Db7 is:'},audio:[],ans:'Lydian b7',opts:["Lydian b7","Whole tone","Mixolydian","Altered"],terms:['substitute_dominant','lydian_b7'],why:{ko:'대리도미넌트는 항상 자기 근음 위 리디안♭7(Lydian dominant)을 코드 스케일로 씁니다 — 어느 화음으로 해결하든 늘 같습니다.',en:'A substitute dominant always uses Lydian ♭7 (Lydian dominant) built on its own root as its chord scale, regardless of what it resolves to.'}});
  add({ch:18,type:'mc',q:{ko:'대리도미넌트 Gb7의 코드 스케일은?',en:'The chord scale for the substitute dominant Gb7 is:'},audio:[],ans:'Lydian b7',opts:["Lydian b7","Whole tone","Mixolydian","Altered"],terms:['substitute_dominant','lydian_b7'],why:{ko:'대리도미넌트는 항상 자기 근음 위 리디안♭7(Lydian dominant)을 코드 스케일로 씁니다 — 어느 화음으로 해결하든 늘 같습니다.',en:'A substitute dominant always uses Lydian ♭7 (Lydian dominant) built on its own root as its chord scale, regardless of what it resolves to.'}});
  add({ch:18,type:'mc',q:{ko:'대리도미넌트 B7의 코드 스케일은?',en:'The chord scale for the substitute dominant B7 is:'},audio:[],ans:'Lydian b7',opts:["Whole tone","Lydian b7","Mixolydian","Altered"],terms:['substitute_dominant','lydian_b7'],why:{ko:'대리도미넌트는 항상 자기 근음 위 리디안♭7(Lydian dominant)을 코드 스케일로 씁니다 — 어느 화음으로 해결하든 늘 같습니다.',en:'A substitute dominant always uses Lydian ♭7 (Lydian dominant) built on its own root as its chord scale, regardless of what it resolves to.'}});
  add({ch:18,type:'mc',q:{ko:'대리도미넌트 E7의 코드 스케일은?',en:'The chord scale for the substitute dominant E7 is:'},audio:[],ans:'Lydian b7',opts:["Altered","Mixolydian","Whole tone","Lydian b7"],terms:['substitute_dominant','lydian_b7'],why:{ko:'대리도미넌트는 항상 자기 근음 위 리디안♭7(Lydian dominant)을 코드 스케일로 씁니다 — 어느 화음으로 해결하든 늘 같습니다.',en:'A substitute dominant always uses Lydian ♭7 (Lydian dominant) built on its own root as its chord scale, regardless of what it resolves to.'}});
  add({ch:18,type:'mc',q:{ko:'대리도미넌트 A7의 코드 스케일은?',en:'The chord scale for the substitute dominant A7 is:'},audio:[],ans:'Lydian b7',opts:["Whole tone","Lydian b7","Altered","Mixolydian"],terms:['substitute_dominant','lydian_b7'],why:{ko:'대리도미넌트는 항상 자기 근음 위 리디안♭7(Lydian dominant)을 코드 스케일로 씁니다 — 어느 화음으로 해결하든 늘 같습니다.',en:'A substitute dominant always uses Lydian ♭7 (Lydian dominant) built on its own root as its chord scale, regardless of what it resolves to.'}});
  add({ch:18,type:'mc',q:{ko:'대리도미넌트 Ab7의 코드 스케일은?',en:'The chord scale for the substitute dominant Ab7 is:'},audio:[],ans:'Lydian b7',opts:["Lydian b7","Mixolydian","Whole tone","Altered"],terms:['substitute_dominant','lydian_b7'],why:{ko:'대리도미넌트는 항상 자기 근음 위 리디안♭7(Lydian dominant)을 코드 스케일로 씁니다 — 어느 화음으로 해결하든 늘 같습니다.',en:'A substitute dominant always uses Lydian ♭7 (Lydian dominant) built on its own root as its chord scale, regardless of what it resolves to.'}});
  add({ch:18,type:'mc',q:{ko:'대리도미넌트(subV7)에서 늘 사용 가능한 텐션은?',en:'The tensions always available on a substitute dominant (subV7) are:'},audio:[],ans:'9, #11, 13',opts:["b9 only","9, #11, 13","#9, b13 only","b9, #9, b13"],terms:['substitute_dominant'],why:{ko:'대리도미넌트는 코드 스케일이 늘 리디안♭7이라, 어떤 화음으로 해결하든 텐션이 항상 9, #11, 13으로 고정됩니다. 몇 안 되는 \'맥락과 무관하게 텐션이 고정된\' 화음 중 하나입니다.',en:'Because its chord scale is always Lydian ♭7, a subV7\'s available tensions are always 9, #11, and 13 — one of the few chords whose tensions never change with context.'}});
  add({ch:18,type:'mc',q:{ko:'교재의 참고사항: subV7/III과 subV7/VI는 이론상 존재하지만, 실제로는 어떻게 더 많이 들릴까요?',en:'Per the textbook note: subV7/III and subV7/VI exist in theory, but in practice they are more often heard as:'},audio:[],ans:'IV7 and bVII7',opts:["I7 and II7","IV7 and bVII7","no difference, always heard as subV7","V7/II and V7/V"],terms:['substitute_dominant'],why:{ko:'교재는 분명히 밝힙니다: subV7/III는 IV7로, subV7/VI는 ♭VII7로 들리는 경우가 더 흔하다고요. 즉 로마숫자 이론은 맞지만, 귀로 들을 때는 다른 기능으로 해석되는 경우가 많다는 뜻입니다 — 이런 예외를 아는 것이 실제 분석력을 키웁니다.',en:'The textbook itself flags this: subV7/III is more commonly heard as IV7, and subV7/VI as bVII7. The Roman-numeral theory is correct, but real listening often favors a different functional reading — worth knowing so your analysis matches your ears.'}});

  /* ── CH 19: Related II-7 Chords (Harmony 3) ── */
  add({ch:19,type:'mc',q:{ko:'C7 앞에 붙는 관련 II−7는?',en:'The related II-7 that precedes C7 is:'},audio:[],ans:'Gm7',opts:["Cm7","Am7","Dm7","Gm7"],terms:['related_ii7'],why:{ko:'관련 II−7는 도미넌트의 완전5도 위, 즉 도미넌트가 원래 혼자 서 있던 자리를 ii−V로 \'펼치는\' 마이너7 화음입니다.',en:'The related II-7 sits a perfect 5th above the dominant, \'unfolding\' a single dominant into a ii–V pair.'}});

  add({ch:19,type:'mc',q:{ko:'Eb7 앞에 붙는 관련 II−7는?',en:'The related II-7 that precedes Eb7 is:'},audio:[],ans:'Bbm7',opts:["Cm7","Ebm7","Fm7","Bbm7"],terms:['related_ii7'],why:{ko:'관련 II−7는 도미넌트의 완전5도 위, 즉 도미넌트가 원래 혼자 서 있던 자리를 ii−V로 \'펼치는\' 마이너7 화음입니다.',en:'The related II-7 sits a perfect 5th above the dominant, \'unfolding\' a single dominant into a ii–V pair.'}});

  add({ch:20,type:'write',q:{ko:'Db°7 (감7화음) — 루트음 주어짐, 나머지를 단3도씩 쌓아 쓰세요.',en:'Db°7 (diminished 7th) — root given, stack minor 3rds to write the rest:'},clef:'treble',given:['Db4'],givenX:90,ans:["Db4","Fb4","Abb4","Cbb5"],audio:["Db4","Fb4","Abb4","Cbb5"],terms:['diminished_7th_chord']});  add({ch:20,type:'mc',q:{ko:'다이아토닉 상황(경과·보조 감화음)에서 감화음의 코드 스케일을 만드는 방법은?',en:'In diatonic situations (passing/auxiliary diminished chords), how do you build the chord scale?'},audio:[],ans:'화음음 사이사이에 그 조성의 다이아토닉 음을 채운다',opts:["화음음 사이사이에 그 조성의 다이아토닉 음을 채운다","항상 온음-반음 대칭 스케일을 쓴다","반음계를 그대로 쓴다","5음음계를 쓴다"],terms:['diminished_chord','passing_diminished'],why:{ko:'다이아토닉 감화음은 대부분 경과·보조 기능이라, 화음음(1,♭3,♭5,6) 사이에 \'그 순간의 조성\'에 맞는 다이아토닉 음을 채워 코드 스케일을 만듭니다. (구조적으로 독립된 감7화음은 다른 대칭 스케일을 씁니다 — 4학기에서 더 다룹니다.)',en:'Most diatonic diminished chords are passing or auxiliary, so their chord scale fills the gaps between the chord tones (1, b3, b5, 6) with notes diatonic to the key of the moment. (Structurally independent diminished 7ths use a different symmetric scale — covered in Harmony 4.)'}});
  add({ch:20,type:'mc',q:{ko:'I°7이나 V°7처럼 다이아토닉 옵션이 두 개(예: 7음 또는 으뜸음) 있을 때, 교재는 어느 쪽을 추천할까요?',en:'When there are two diatonic options for I°7 or V°7 (e.g., scale-degree 7 or 1), which does the textbook recommend?'},audio:[],ans:'더 강한 스케일 도수(예: 으뜸음) 쪽',opts:["더 강한 스케일 도수(예: 으뜸음) 쪽","항상 낮은 음","항상 반음 위","무작위로 선택"],terms:['diminished_chord'],why:{ko:'교재는 명확히 말합니다: 두 다이아토닉 옵션이 있을 때는 더 안정적인(강한) 스케일 도수 쪽을 선택하는 걸 권장하되, 어느 쪽이든 이론적으로는 허용된다고요. 정답이 하나로 딱 떨어지지 않는, 맥락에 따라 유연한 규칙입니다.',en:'The textbook is explicit: when two diatonic options exist, it recommends the stronger (more stable) scale degree — while noting either pitch is theoretically acceptable. A flexible rule, not a rigid one.'}});
  /* ── CH 21: Modulation (Harmony 3) ── */
  add({ch:21,type:'mc',q:{ko:'전조 직후, 새 조성에서 화성이 몇 마디 이상 확실히 자리 잡아야 \'전조가 일어났다\'고 볼 수 있나요?',en:'After a modulation, how firmly must the new key be established before we call it a true modulation (vs. a brief tonicization)?'},audio:[],ans:'적어도 몇 마디 동안 새 조성이 다이아토닉하게 확인되어야 함',opts:["적어도 몇 마디 동안 새 조성이 다이아토닉하게 확인되어야 함","화음 하나만 바뀌면 충분함","꼭 종지가 있어야만 함","항상 곡 전체가 새 조로 끝나야 함"],terms:['modulation','primary_key','secondary_key'],why:{ko:'짧게 스쳐 지나가는 임시 이조(토니시제이션)와 달리, 진짜 전조는 새 조성(secondary key)이 다이아토닉하게 최소 몇 마디 이상 자리를 잡아야 인정됩니다.',en:'Unlike a brief tonicization, a true modulation requires the new (secondary) key to be established diatonically for at least a few measures.'}});
  add({ch:21,type:'mc',q:{ko:'직접 전조(direct modulation)의 특징은?',en:'Direct modulation is characterized by:'},audio:[],ans:'공통 화음 없이 갑자기 새 조성으로 넘어감',opts:["공통 화음 없이 갑자기 새 조성으로 넘어감","두 조성에 공통되는 화음을 경첩처럼 사용함","새로운 조표로 가기 전 임시 전조 구간을 거침","도미넌트 화음 하나로만 전조함"],terms:['direct_modulation'],why:{ko:'직접 전조는 원조와 새 조 사이를 이어주는 공통 화음(피벗 코드) 없이, 갑작스럽게 새 조성으로 건너뜁니다.',en:'Direct modulation moves to the new key abruptly, without a shared pivot chord bridging the two keys.'}});
  add({ch:21,type:'mc',q:{ko:'피벗 코드(pivot chord) 전조의 핵심은?',en:'The key idea behind pivot-chord modulation is:'},audio:[],ans:'원조와 새 조 양쪽에 다이아토닉하게 속하는 화음을 경첩처럼 사용',opts:["원조와 새 조 양쪽에 다이아토닉하게 속하는 화음을 경첩처럼 사용","항상 반음계적 화음만 사용","전조 직후 원조로 즉시 복귀","새 조의 딸림화음만 사용"],terms:['pivot_chord'],why:{ko:'피벗 코드는 원조에서도, 새 조에서도 자연스럽게 다이아토닉한 화음이라 두 조성을 부드럽게 이어주는 \'경첩\' 역할을 합니다.',en:'A pivot chord is diatonic to both the old and new keys, acting as a hinge that connects them smoothly.'}});
  add({ch:21,type:'mc',q:{ko:'전이적 전조(transitional modulation)에서 새 조성으로 가는 다리 역할을 하는 것은?',en:'In transitional modulation, what bridges the way into the new key?'},audio:[],ans:'새 조성 자체에 속하지 않는 화음(들)이 잠시 다리처럼 쓰임',opts:["새 조성 자체에 속하지 않는 화음(들)이 잠시 다리처럼 쓰임","항상 셋잇단음표 리듬","완전히 무조성 구간","박자 변화"],terms:['modulation'],why:{ko:'전이적 전조는 원조에도 새 조에도 다이아토닉하지 않는 화음을 짧게 다리처럼 거쳐서 새 조성에 도달합니다.',en:'Transitional modulation briefly passes through chord(s) diatonic to neither key, using them as a bridge into the new key.'}});
  add({ch:21,type:'mc',q:{ko:'기만적 도미넌트 전조(deceptive dominant modulation)의 특징은?',en:'Deceptive dominant modulation is characterized by:'},audio:[],ans:'도미넌트가 예상된 화음 대신 새 조성의 화음으로 기만적으로 해결됨',opts:["도미넌트가 예상된 화음 대신 새 조성의 화음으로 기만적으로 해결됨","도미넌트가 완전5도 하행으로만 해결됨","딸림화음을 아예 쓰지 않음","항상 단조로만 전조함"],terms:['dominant_chord_modulation','deceptive_resolution'],why:{ko:'원래 조성에서 기대되는 화음 대신, 그 도미넌트를 새 조성의 화음으로 \'기만적으로\' 해결시켜 전조를 이끌어냅니다.',en:'The dominant resolves deceptively — not to the expected chord in the original key, but to a chord that launches the new key.'}});
  add({ch:21,type:'mc',q:{ko:'원조(primary key)와 새 조(secondary key)라는 용어는 어떤 관계를 나타내나요?',en:'The terms primary key and secondary key describe:'},audio:[],ans:'곡이 시작한 조성(원조)과 전조로 도달한 조성(새 조)',opts:["곡이 시작한 조성(원조)과 전조로 도달한 조성(새 조)","장조와 단조의 구분","빠른 곡과 느린 곡의 구분","다이아토닉과 반음계적 조성의 구분"],terms:['primary_key','secondary_key'],why:{ko:'원조는 곡(혹은 섹션)이 출발한 조성, 새 조는 전조를 통해 도달한 조성을 가리키는 상대적인 용어입니다.',en:'Primary key is where the piece (or section) started; secondary key is where a modulation has taken it.'}});
  add({ch:21,type:'mc',q:{ko:'전조 지점을 분석할 때, 원조와 새 조 사이의 관계를 표시하는 일반적인 방법은?',en:'When analyzing a modulation point, how is the relationship between the two keys typically notated?'},audio:[],ans:'두 으뜸음 사이의 음정(예: 완전5도 위, 단3도 위)으로 표시',opts:["두 으뜸음 사이의 음정(예: 완전5도 위, 단3도 위)으로 표시","항상 로마숫자 I로만 표시","박자표로 표시","빠르기말로 표시"],terms:['modulation'],why:{ko:'전조는 흔히 화살표와 함께, 원래 으뜸음에서 새 으뜸음까지의 음정(예: ↗5도, ↘3도)으로 표시해 새 조성이 어디서 왔는지 한눈에 보여줍니다.',en:'Modulations are often marked with an arrow and the interval between the old and new tonic (e.g., up a 5th, down a 3rd), showing at a glance where the new key came from.'}});
  add({ch:21,type:'mc',q:{ko:'암시적 전조(implied modulation)란?',en:'An implied modulation is:'},audio:[],ans:'새 조성이 뚜렷이 확립되지 못한 채, 잠깐 암시만 되는 전조',opts:["새 조성이 뚜렷이 확립되지 못한 채, 잠깐 암시만 되는 전조","가장 확실하고 긴 전조","항상 셈여림표로 표시되는 전조","보컬 없이 일어나는 전조"],terms:['implied_modulation'],why:{ko:'암시적 전조는 새 조성이 완전히 자리 잡지 못하고 짧게 스쳐가듯 암시만 되는 경우를 가리킵니다 — 토니시제이션에 가까운 약한 전조입니다.',en:'An implied modulation only briefly suggests a new key without fully establishing it — closer to a tonicization than a firm modulation.'}});
  /* ── CH 22: Dominants Without Dominant Function & Contiguous Dominants (Harmony 3) ── */
  add({ch:22,type:'mc',q:{ko:'I7, II7, III7, IV7, VI7, ♭VI7, VII7, ♭VII7처럼 딸림7화음 구조를 가진 화음이 늘 완전5도나 반음 아래로 해결되는 건 아닙니다. 이런 경우를 뭐라 부르나요?',en:'Chords built like dominant 7ths (I7, II7, III7, IV7, VI7, bVI7, VII7, bVII7...) don\'t always resolve down a 5th or half step. What do we call this?'},audio:[],ans:'도미넌트 기능이 없는 딸림7화음',opts:["도미넌트 기능이 없는 딸림7화음","세컨더리 도미넌트","대리도미넌트","확장 도미넌트"],terms:['nondominant_dominant'],why:{ko:'구조는 딸림7화음(장3도+단3도+단3도)이지만, 청자가 굳이 완전5도·반음 아래로의 해결을 기대하지 않는 화음들입니다. 블루스의 IV7가 대표적인 예입니다.',en:'These have the dominant-7th structure (major 3rd + minor 3rd + minor 3rd) but the listener doesn\'t necessarily expect a perfect-5th or half-step resolution. The IV7 in a blues is a classic example.'}});
  add({ch:22,type:'mc',q:{ko:'블루스에서 IV7가 도미넌트처럼 해결되길 기대하지 않는 이유는?',en:'Why don\'t we expect the IV7 in a blues to resolve like a true dominant?'},audio:[],ans:'블루스 특유의 관용구(스타일)로 굳어져 다른 기능으로 들림',opts:["블루스 특유의 관용구(스타일)로 굳어져 다른 기능으로 들림","IV7는 애초에 딸림7화음 구조가 아니라서","블루스에는 아예 딸림화음이 없어서","IV7는 항상 I로 해결되기 때문에"],terms:['blue_note_dominant','nondominant_dominant'],why:{ko:'블루스 스타일 자체가 이 화음 어휘를 관용구로 굳혀 놓았기 때문에, 구조상 도미넌트라도 실제로는 다른 색채(블루노트적 성격)로 들립니다.',en:'The blues idiom itself has fixed this chord vocabulary as a stylistic convention, so even though it\'s structurally a dominant, it functions and sounds differently.'}});
  add({ch:22,type:'mc',q:{ko:'딸림7화음 구조의 화음이 조성 안에서 두 가지 역할(예: 도미넌트 기능과 비-도미넌트 기능)을 오갈 수 있는 것을 뭐라 하나요?',en:'When a dominant-7th-structured chord can serve two different roles depending on context, this is called:'},audio:[],ans:'이중 기능(dual function)',opts:["이중 기능(dual function)","확장 도미넌트","경과 화음","보조 화음"],terms:['dual_function'],why:{ko:'같은 화음이라도 앞뒤 맥락에 따라 도미넌트 기능으로 들릴 수도, 다른 기능(예: 블루스 관용구)으로 들릴 수도 있는 경우를 이중 기능이라 합니다.',en:'The same chord can be heard as functioning one way in one context and another way elsewhere — this flexibility is called dual function.'}});
  add({ch:22,type:'mc',q:{ko:'이어지는 도미넌트(contiguous dominants)란 무엇을 말하나요?',en:'What are contiguous dominants?'},audio:[],ans:'관련 II−7 화음들이 끊이지 않고 연속으로 이어지는 ii−V 사슬',opts:["관련 II−7 화음들이 끊이지 않고 연속으로 이어지는 ii−V 사슬","서로 다른 조성의 도미넌트가 동시에 울리는 것","딸림화음이 하나도 없는 진행","항상 반음계로만 이어지는 진행"],terms:['contiguous_dominant'],why:{ko:'여러 개의 ii−V(관련 II−7 + 도미넌트) 쌍이 끊임없이 이어져 사슬처럼 진행하는 것을 이어지는 도미넌트라 부릅니다.',en:'When several ii-V pairs (related II-7 plus dominant) chain together back-to-back without interruption, that\'s called contiguous dominants.'}});
  add({ch:22,type:'mc',q:{ko:'"Tricycles" 같은 곡에서 자주 보이는, 짧은 ii-V가 여러 조성을 빠르게 스치듯 지나가는 패턴을 무엇으로 분석하나요?',en:'Tunes with rapid, short ii-V pairs briefly touching several keys are best analyzed as:'},audio:[],ans:'이어지는 II−7 V7들 (각기 다른 임시 목표를 향한 세컨더리/대리 도미넌트 사슬)',opts:["이어지는 II−7 V7들 (각기 다른 임시 목표를 향한 세컨더리/대리 도미넌트 사슬)","단일 조성의 다이아토닉 진행","완전히 무조성적인 진행","페달 포인트 위의 화성"],terms:['contiguous_dominant','related_ii7'],why:{ko:'이런 곡은 여러 개의 짧은 ii-V가 각자 다른 임시 목표를 향해 연달아 이어지는 것으로 분석하는 것이 가장 자연스럽습니다.',en:'These tunes are most naturally analyzed as a chain of short ii-V pairs, each briefly targeting a different chord.'}});
  add({ch:22,type:'mc',q:{ko:'딸림7화음 구조지만 도미넌트 기능이 없는 화음들(I7, II7, III7, IV7, VI7, ♭VI7, VII7, ♭VII7)을 진행에 채워 넣을 때 무엇을 고려해야 하나요?',en:'When inserting non-dominant-function dominant-structured chords (I7, II7, III7, IV7, VI7, bVI7, VII7, bVII7) into a progression, what should guide the choice?'},audio:[],ans:'화성 리듬과 앞뒤에 오는 화음(맥락)',opts:["화성 리듬과 앞뒤에 오는 화음(맥락)","항상 알파벳 순서","가장 낮은 음부터 순서대로","무작위로 아무거나"],terms:['nondominant_dominant'],why:{ko:'이런 화음들은 정해진 하나의 정답이 없습니다 — 화성 리듬(코드가 바뀌는 속도)과 앞뒤 맥락을 고려해 선택해야 자연스럽게 어울립니다.',en:'There\'s no single correct answer here — the choice depends on harmonic rhythm and the surrounding context to sound natural.'}});

  /* ── CH 23: Modal Source — Relative Ionian (Harmony 4) ── */
  add({ch:23,type:'mc',q:{ko:'이 스케일(A aeolian)의 근원이 되는 장음계(관련 아이오니안)는?',en:'The relative Ionian (source major scale) of this A aeolian scale is:'},staff:noteRow(["A4","B4","C5","D5","E5","F5","G5","A5"],'treble',{sp:36,sx:70}),audio:["A4","B4","C5","D5","E5","F5","G5","A5"],ans:'C major',opts:mkOpts('C major',["G major","D major","A major","E major","B major","F# major","Db major","Ab major","Eb major","Bb major","F major"],4),terms:['relative_ionian'],why:{ko:'A 에올리안는 C 장음계와 조표가 완전히 같습니다 — 그냥 같은 흰 건반들을 A부터 다시 센 것뿐이에요. 그래서 C 장조가 이 선법의 \'근원(관련 아이오니안)\'이 됩니다.',en:'A aeolian shares the exact same key signature as C major — it\'s just the same notes counted starting from A instead. That makes C major the \'source\' (relative Ionian) of this mode.'}});
  add({ch:23,type:'mc',q:{ko:'이 스케일(G mixolydian)의 근원이 되는 장음계(관련 아이오니안)는?',en:'The relative Ionian (source major scale) of this G mixolydian scale is:'},staff:noteRow(["G4","A4","B4","C5","D5","E5","F5","G5"],'treble',{sp:36,sx:70}),audio:["G4","A4","B4","C5","D5","E5","F5","G5"],ans:'C major',opts:mkOpts('C major',["G major","D major","A major","E major","B major","F# major","Db major","Ab major","Eb major","Bb major","F major"],4),terms:['relative_ionian'],why:{ko:'G 믹소리디안는 C 장음계와 조표가 완전히 같습니다 — 그냥 같은 흰 건반들을 G부터 다시 센 것뿐이에요. 그래서 C 장조가 이 선법의 \'근원(관련 아이오니안)\'이 됩니다.',en:'G mixolydian shares the exact same key signature as C major — it\'s just the same notes counted starting from G instead. That makes C major the \'source\' (relative Ionian) of this mode.'}});
  add({ch:23,type:'mc',q:{ko:'이 스케일(A dorian)의 근원이 되는 장음계(관련 아이오니안)는?',en:'The relative Ionian (source major scale) of this A dorian scale is:'},staff:noteRow(["A3","B3","C4","D4","E4","F#4","G4","A4"],'treble',{sp:36,sx:70}),audio:["A3","B3","C4","D4","E4","F#4","G4","A4"],ans:'G major',opts:mkOpts('G major',["C major","D major","A major","E major","B major","F# major","Db major","Ab major","Eb major","Bb major","F major"],4),terms:['relative_ionian'],why:{ko:'A 도리안는 G 장음계와 조표가 완전히 같습니다 — 그냥 같은 흰 건반들을 A부터 다시 센 것뿐이에요. 그래서 G 장조가 이 선법의 \'근원(관련 아이오니안)\'이 됩니다.',en:'A dorian shares the exact same key signature as G major — it\'s just the same notes counted starting from A instead. That makes G major the \'source\' (relative Ionian) of this mode.'}});
  add({ch:23,type:'mc',q:{ko:'이 스케일(D mixolydian)의 근원이 되는 장음계(관련 아이오니안)는?',en:'The relative Ionian (source major scale) of this D mixolydian scale is:'},staff:noteRow(["D4","E4","F#4","G4","A4","B4","C5","D5"],'treble',{sp:36,sx:70}),audio:["D4","E4","F#4","G4","A4","B4","C5","D5"],ans:'G major',opts:mkOpts('G major',["C major","D major","A major","E major","B major","F# major","Db major","Ab major","Eb major","Bb major","F major"],4),terms:['relative_ionian'],why:{ko:'D 믹소리디안는 G 장음계와 조표가 완전히 같습니다 — 그냥 같은 흰 건반들을 D부터 다시 센 것뿐이에요. 그래서 G 장조가 이 선법의 \'근원(관련 아이오니안)\'이 됩니다.',en:'D mixolydian shares the exact same key signature as G major — it\'s just the same notes counted starting from D instead. That makes G major the \'source\' (relative Ionian) of this mode.'}});
  add({ch:23,type:'mc',q:{ko:'이 스케일(B aeolian)의 근원이 되는 장음계(관련 아이오니안)는?',en:'The relative Ionian (source major scale) of this B aeolian scale is:'},staff:noteRow(["B4","C#5","D5","E5","F#5","G5","A5","B5"],'treble',{sp:36,sx:70}),audio:["B4","C#5","D5","E5","F#5","G5","A5","B5"],ans:'D major',opts:mkOpts('D major',["C major","G major","A major","E major","B major","F# major","Db major","Ab major","Eb major","Bb major","F major"],4),terms:['relative_ionian'],why:{ko:'B 에올리안는 D 장음계와 조표가 완전히 같습니다 — 그냥 같은 흰 건반들을 B부터 다시 센 것뿐이에요. 그래서 D 장조가 이 선법의 \'근원(관련 아이오니안)\'이 됩니다.',en:'B aeolian shares the exact same key signature as D major — it\'s just the same notes counted starting from B instead. That makes D major the \'source\' (relative Ionian) of this mode.'}});
  add({ch:23,type:'mc',q:{ko:'이 스케일(A mixolydian)의 근원이 되는 장음계(관련 아이오니안)는?',en:'The relative Ionian (source major scale) of this A mixolydian scale is:'},staff:noteRow(["A4","B4","C#5","D5","E5","F#5","G5","A5"],'treble',{sp:36,sx:70}),audio:["A4","B4","C#5","D5","E5","F#5","G5","A5"],ans:'D major',opts:mkOpts('D major',["C major","G major","A major","E major","B major","F# major","Db major","Ab major","Eb major","Bb major","F major"],4),terms:['relative_ionian'],why:{ko:'A 믹소리디안는 D 장음계와 조표가 완전히 같습니다 — 그냥 같은 흰 건반들을 A부터 다시 센 것뿐이에요. 그래서 D 장조가 이 선법의 \'근원(관련 아이오니안)\'이 됩니다.',en:'A mixolydian shares the exact same key signature as D major — it\'s just the same notes counted starting from A instead. That makes D major the \'source\' (relative Ionian) of this mode.'}});

      why:{ko:inv?`베이스음이 ${triadRoot} 3화음 자체의 구성음(3음이나 5음)이라 그냥 자리바꿈입니다 — 코드의 정체성은 그대로고 어느 음이 맨 아래 오느냐만 바뀐 것뿐이에요.`:`베이스음이 ${triadRoot} 3화음의 구성음이 아니라서, 단순 자리바꿈이 아니라 \'하이브리드 화음\'입니다 — 서로 다른 두 화성적 요소(삼화음+낯선 베이스음)가 합쳐진 컴파운드 코드의 한 종류예요.`,
      en:inv?`The bass note is one of the ${triadRoot} triad's own tones (its 3rd or 5th), so this is simply an inversion — same chord identity, just a different note on the bottom.`:`The bass note isn't part of the ${triadRoot} triad at all, which makes this a hybrid chord rather than a plain inversion — a compound chord formed by combining two separate harmonic elements (a triad plus an unrelated bass note).`}});

  /* ── CH 30: Polychords (Harmony 4) ── */
  add({ch:30,type:'mc',q:{ko:'위 오선엔 완전한 D 3화음이, 아래 오선엔 C 음이 옵니다 (D/C로 표기). 이런 구조를 무엇이라 부르나요?',en:'A complete D triad sits in the treble staff, with C alone in the bass (notated D/C). What is this structure called?'},staff:grandStaff(["D4","F#4","A4"],'C3',200),audio:["C3","D4","F#4","A4"],ans:'폴리코드(polychord)',opts:['폴리코드(polychord)','단순 자리바꿈(inversion)','피벗 화음','컨스턴트 스트럭처'],terms:['polychord'],why:{ko:'악보에 실제로 쓸 때는 아래 화음 전체를 다시 적지 않고, 베이스 음 하나로 줄여서 D/C처럼 씁니다. 하이브리드 화음과 표기는 똑같아 보일 수 있지만, 폴리코드는 위·아래 두 화성이 \'하나의 변형된 화음\'이 아니라 \'서로 다른 두 조성/화성\'으로 뚜렷이 들리도록 의도된 것이라는 점이 다릅니다.',en:'In real scores, the lower chord isn\'t re-spelled in full — it\'s compressed to just its root, written as D/C. This can look identical to a hybrid chord, but the intent is different: a polychord is meant to be heard as two genuinely separate harmonies (even two key-centers) rather than one altered chord.'}});
  add({ch:30,type:'mc',q:{ko:'위 오선엔 완전한 Eb 3화음이, 아래 오선엔 C 음이 옵니다 (Eb/C로 표기). 이런 구조를 무엇이라 부르나요?',en:'A complete Eb triad sits in the treble staff, with C alone in the bass (notated Eb/C). What is this structure called?'},staff:grandStaff(["Eb4","G4","Bb4"],'C3',200),audio:["C3","Eb4","G4","Bb4"],ans:'폴리코드(polychord)',opts:['폴리코드(polychord)','단순 자리바꿈(inversion)','피벗 화음','컨스턴트 스트럭처'],terms:['polychord'],why:{ko:'악보에 실제로 쓸 때는 아래 화음 전체를 다시 적지 않고, 베이스 음 하나로 줄여서 Eb/C처럼 씁니다. 하이브리드 화음과 표기는 똑같아 보일 수 있지만, 폴리코드는 위·아래 두 화성이 \'하나의 변형된 화음\'이 아니라 \'서로 다른 두 조성/화성\'으로 뚜렷이 들리도록 의도된 것이라는 점이 다릅니다.',en:'In real scores, the lower chord isn\'t re-spelled in full — it\'s compressed to just its root, written as Eb/C. This can look identical to a hybrid chord, but the intent is different: a polychord is meant to be heard as two genuinely separate harmonies (even two key-centers) rather than one altered chord.'}});

  add({ch:30,type:'mc',q:{ko:'스트라빈스키의 발레 《페트루슈카》(1911)에 나오는 유명한 화음입니다. 위엔 C장3화음, 아래엔 F#가 옵니다 (C/F#). 이 유명한 화음을 부르는 별명은?',en:'A famous chord from Stravinsky\'s ballet Petrushka (1911): a C major triad over F# in the bass (C/F#). What is this chord\'s famous nickname?'},staff:grandStaff(['C5','E5','G5'],'F#3',200),audio:['F#3','C5','E5','G5'],ans:'페트루슈카 화음(Petrushka Chord)',opts:['페트루슈카 화음(Petrushka Chord)','트리스탄 화음(Tristan Chord)','피카르디 3도','컨스턴트 스트럭처'],terms:['polychord'],why:{ko:'C장3화음과 트라이톤 떨어진 F#장3화음을 동시에 울리는 이 화음은 20세기 초 폴리코드(바이토널리티)의 가장 유명한 예로 꼽힙니다. 두 화음이 트라이톤 관계라 서로의 코드톤과 절대 겹치지 않아, 두 조성이 동시에 들리는 효과가 극대화됩니다.',en:'Sounding a C major triad against an F# major triad a tritone away, this is one of the most famous examples of a polychord (bitonality) in early 20th-century music. Because the two triads are a tritone apart, none of their chord tones overlap — maximizing the sense of two keys colliding at once.'}});

  [
    {key:'C',minorTonic:['C4','Eb4','G4'],picardy:['C4','E4','G4']},
    {key:'D',minorTonic:['D4','F4','A4'],picardy:['D4','F#4','A4']},

    {key:'A',minorTonic:['A3','C4','E4'],picardy:['A3','C#4','E4']},
    {key:'E',minorTonic:['E4','G4','B4'],picardy:['E4','G#4','B4']},
    {key:'F',minorTonic:['F3','Ab3','C4'],picardy:['F3','A3','C4']},
  ].forEach(({key,minorTonic,picardy})=>{
    add({ch:31,type:'mc',q:{ko:`단조 곡이 ${key} 단조 으뜸화음 대신, 이렇게 3음을 반음 올린 장3화음으로 끝난다면 이 기법을 무엇이라 부르나요?`,en:`If a minor-key piece ends not on the minor tonic but on this triad — same root, 3rd raised a half step to major — what's this technique called?`},
      staff:drawStaff({cl:'treble',ns:picardy.map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),
      audio:picardy,ans:'피카르디 3도(Picardy Third)',opts:['피카르디 3도(Picardy Third)','모달 인터체인지','토닉 대역','기만 종지'],terms:['picardy_third'],
      why:{ko:`단조 곡의 마지막 으뜸화음에서만 3음을 반음 올려 장3화음으로 밝게 끝맺는 관습을 피카르디 3도라고 부릅니다. ${key} 단조라면 ${minorTonic.map(n=>n.replace(/\d+$/,'')).join('-')} 대신 ${picardy.map(n=>n.replace(/\d+$/,'')).join('-')}로 끝나는 식이에요.`,
      en:`Raising just the final tonic chord's 3rd to major — ending a minor-key piece on a bright major chord — is called a Picardy third. In ${key} minor, that means ending on ${picardy.map(n=>n.replace(/\d+$/,'')).join('-')} instead of ${minorTonic.map(n=>n.replace(/\d+$/,'')).join('-')}.`}});

      staff:drawStaff({cl:'treble',ns:ns.map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),
      audio:ns,ans:'토닉 대역(Tonic Substitute)',opts:['토닉 대역(Tonic Substitute)','관련 II−7','피벗 화음','서브도미넌트 마이너'],terms:['tonic_substitute'],
      why:{ko:`${rn}는 으뜸화음과 공통음을 2개나 공유하고 있어서(${chord}와 으뜸3화음 사이), 으뜸화음 대신 쓰여도 비슷하게 안정적으로 들립니다. 이런 화음을 토닉 대역(토닉 서브스티튜트)이라 부릅니다.`,
      en:`${rn} shares two common tones with the tonic triad, so it can substitute for the tonic and still sound restful. Chords like this are called tonic substitutes.`}});

  add({ch:33,type:'write',q:{ko:'C6 (장6화음) — 루트음 주어짐, 나머지를 쓰세요 (3화음 + 6음).',en:'C6 (major 6th chord) — root given, write the rest (triad + added 6th):'},clef:'treble',given:['C4'],givenX:80,ans:["C4","E4","G4","A4"],audio:["C4","E4","G4","A4"],terms:['sixth_chord'],why:{ko:'6화음은 장3화음 위에 6음(근음에서 장6도)을 얹은 것으로, 7화음과 달리 온화하고 안정적인 소리를 내서 으뜸화음(토닉) 자리에 자주 쓰입니다.',en:'A 6th chord is a major triad with a 6th (a major 6th above the root) added on top. Unlike 7th chords, it has a settled, consonant sound, so it\'s commonly used as a tonic-function chord.'}});

  add({ch:36,type:'mc',q:{ko:'C7 위에 D 장3화음이 상부 3화음(upper structure triad)으로 얹혀 있습니다. 이 상부 3화음의 근음은 도미넌트 근음 기준 로마숫자로 몇 도인가요?',en:'A D major triad sits as the upper structure over C7. What Roman-numeral scale degree is the triad\'s root, relative to the dominant\'s root?'},staff:grandStaff(["D4","F#4","A4"],'C3',200),audio:["C3","D4","F#4","A4"],ans:'II',opts:["II","bIII","bII","bVI"],terms:['upper_structure_triad'],why:{ko:'상부 3화음은 도미넌트 근음 위에 다른 장3화음을 얹어 특정 텐션들을 한 번에 암시하는 표기법입니다. 근음이 도미넌트에서 몇 도 위에 있는지(II)로 어떤 텐션 조합을 암시하는지 정해집니다.',en:'An upper structure triad stacks a major triad above the dominant\'s root to imply a specific set of tensions all at once. Which scale degree the triad\'s root sits on above the dominant (II here) determines exactly which tensions it implies.'}});

  add({ch:37,type:'mc',q:{ko:'C 블루스(12마디 기본형)에서, 4번째 마디에 오는 화음은?',en:'In a C blues (standard 12-bar form), which chord falls in bar 4?'},staff:drawStaff({cl:'treble',ns:["C3","E3","G3","Bb3"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["C3","E3","G3","Bb3"],ans:'I7',opts:["I7","IV7","V7"],terms:['blues_12bar'],why:{ko:'12마디 블루스 기본형은 I7(1-4마디) → IV7(5-6) → I7(7-8) → V7(9) → IV7(10) → I7(11) → V7(12, 턴어라운드) 순서로 고정되어 있어, 이 틀만 외우면 어떤 조성이든 바로 적용할 수 있어요.',en:'The standard 12-bar blues form is fixed: I7 (bars 1-4) → IV7 (5-6) → I7 (7-8) → V7 (9) → IV7 (10) → I7 (11) → V7 (12, the turnaround) — memorize this once and it transposes to any key.'}});

  /* ── CH 38: Modal Characteristic & Cadence Chords (Harmony 4) ── */
  add({ch:38,type:'mc',q:{ko:'C 도리안에서, 그 선법의 특성음을 3화음 안에 담고 있어 \'특징 화음(characteristic chord)\'으로 꼽히는 화음의 로마숫자는?',en:'In C dorian, which Roman numeral is the "characteristic chord" -- the triad that carries the mode\'s characteristic pitch?'},staff:drawStaff({cl:'treble',ns:["F4","A4","C5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["F4","A4","C5"],ans:'IV',opts:["II","bII","bVII","bVI","IV"],terms:['characteristic_chord'],why:{ko:'도리안의 특징 화음은 IV입니다 -- 자연 6음을 3음으로 포함해 장3화음이 되는 화음이라, 이 화음 하나만 들어도 다른 선법과 뚜렷이 구별되는 색채가 드러납니다.',en:'The characteristic chord of dorian is IV -- it is a major triad thanks to the natural 6th it contains as its 3rd, so this single chord alone reveals the mode\'s distinctive color.'}});

  add({ch:39,type:'mc',q:{ko:'이 감7화음은 원래 Dm7으로 해결될 것이 기대되지만, 멜로디 음을 살리려고 같은 근음의 D7로 대신 해결됩니다. 이런 해결을 무엇이라 부르나요?',en:'This dim7 chord is expected to resolve to Dm7, but instead resolves to D7 (same root, different quality) to accommodate a melody note. What is this called?'},staff:drawStaff({cl:'treble',ns:["C#4","E4","G4","Bb4"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140})),w:280}),audio:["C#4","E4","G4","Bb4"],ans:'대체 해결(alternate resolution)',opts:['대체 해결(alternate resolution)','기만적 해결(deceptive resolution)','피벗 화음','확장 도미넌트'],terms:['alternate_resolution','ascending_diminished'],why:{ko:'감7화음이 기대되는 화음 대신, 멜로디 음을 살리기 위해 다른 화음으로 해결하는 것을 대체 해결이라 부릅니다. 대개 목표의 관련 도미넌트로 옮기거나(베이스는 유지), 이번 예시처럼 같은 근음에서 성질만 바꿉니다.',en:'When a diminished 7th chord resolves to a different chord than expected in order to accommodate a melody note, that is called an alternate resolution. This usually means moving to the target\'s related dominant (keeping the bass smooth), or, as here, keeping the same root with a changed quality.'}});

  /* ── CH 40: Composite Minor Scale (Harmony 4) ── */
  add({ch:40,type:'mc',q:{ko:'C 복합단음계(composite minor)에서, 6음과 7음 자리에 각각 몇 개의 선택지가 있나요?',en:'In the C composite minor scale, how many options are available for scale degrees 6 and 7?'},staff:drawStaff({cl:'treble',ns:[{note:'C4',acc:'',color:'#1a1a1a',style:'whole',x:90},{note:'D4',acc:'',color:'#1a1a1a',style:'whole',x:114},{note:'Eb4',acc:'',color:'#1a1a1a',style:'whole',x:138},{note:'F4',acc:'',color:'#1a1a1a',style:'whole',x:162},{note:'G4',acc:'',color:'#1a1a1a',style:'whole',x:186},{note:'Ab4',acc:'',color:'#1a1a1a',style:'whole',x:210},{note:'A4',acc:'',color:'#7a3b52',style:'whole',x:234},{note:'Bb4',acc:'',color:'#1a1a1a',style:'whole',x:258},{note:'B4',acc:'',color:'#7a3b52',style:'whole',x:282}],w:346}),audio:["C4","D4","Eb4","F4","G4","Ab4","A4","Bb4","B4"],ans:'각각 2개씩 (자연 음 + 올린 음)',opts:['각각 2개씩 (자연 음 + 올린 음)','각각 1개씩 고정','6음만 2개, 7음은 1개','3개씩'],terms:['composite_minor'],why:{ko:'복합단음계는 자연·화성·가락단음계를 한데 모아, 6도와 7도가 원래 음과 올린 음 둘 다 가능하다고 보는 틀입니다. 이 때문에 단조의 도미넌트 화음은 장조보다 텐션 선택지가 더 다양합니다.',en:'The composite minor scale is a framework combining natural, harmonic, and melodic minor, treating both the natural and raised 6th and 7th degrees as available. This is why dominant chords in minor keys have more tension options than in major keys.'}});

  /* -- CH 41: V7 Seven Deceptive Resolutions (Harmony 4) -- */
  add({ch:41,type:'mc',q:{ko:'C 장조에서 G7이 예상되는 으뜸화음 대신, 근음이 장2도 위인 Am7로 기만적으로 해결됩니다. 로마숫자로는?',en:'In C major, G7 resolves deceptively (not to the tonic) to Am7, whose root sits up a whole step from the dominant. What is the Roman numeral?'},staff:drawStaff({cl:'treble',ns:["G4","B4","D5","F5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:130+i*4})),w:280}),audio:["G4","B4","D5","F5","A4","C5","E5","G5"],ans:'VI-7',opts:["VI-7","#IV-7(b5)","bVIImaj7","bVImaj7"],terms:['deceptive_resolution'],why:{ko:'케이던스에서 가장 안정적인 두 음은 도(1도)와 솔(5도)입니다. 이 화음(VI-7)이 특별한 이유는 그 도(포함)와 솔을 여전히 품고 있어서, 귀에는 \'절반의 해결\'처럼 들리기 때문입니다. V7는 이런 식으로 총 7가지 경로로 기만적 해결을 할 수 있고, VI-7는 토닉 대역 계열입니다.',en:'At a cadence, the two most stable pitches are degree 1 (do) and degree 5 (sol) of the key. This chord (VI-7) sounds like a partial resolution precisely because it still holds onto one or both of those pitches. V7 can resolve deceptively along seven such paths in total, and VI-7 belongs to the tonic substitute family.'}});
  add({ch:41,type:'mc',q:{ko:'C 장조에서 G7이 예상되는 으뜸화음 대신, 근음이 장3도 아래인 Ebmaj7로 기만적으로 해결됩니다. 로마숫자로는?',en:'In C major, G7 resolves deceptively (not to the tonic) to Ebmaj7, whose root sits down a major 3rd from the dominant. What is the Roman numeral?'},staff:drawStaff({cl:'treble',ns:["G4","B4","D5","F5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:130+i*4})),w:280}),audio:["G4","B4","D5","F5","Eb4","G4","Bb4","D5"],ans:'bIIImaj7',opts:["bVIImaj7","bIIImaj7","bIImaj7","bVImaj7"],terms:['deceptive_resolution'],why:{ko:'케이던스에서 가장 안정적인 두 음은 도(1도)와 솔(5도)입니다. 이 화음(bIIImaj7)이 특별한 이유는 그 도(없음)와 솔을 여전히 품고 있어서, 귀에는 \'절반의 해결\'처럼 들리기 때문입니다. V7는 이런 식으로 총 7가지 경로로 기만적 해결을 할 수 있고, bIIImaj7는 토닉 마이너 계열입니다.',en:'At a cadence, the two most stable pitches are degree 1 (do) and degree 5 (sol) of the key. This chord (bIIImaj7) sounds like a partial resolution precisely because it still holds onto one or both of those pitches. V7 can resolve deceptively along seven such paths in total, and bIIImaj7 belongs to the tonic minor family.'}});
  add({ch:41,type:'mc',q:{ko:'C 장조에서 G7이 예상되는 으뜸화음 대신, 근음이 반음 위인 Abmaj7로 기만적으로 해결됩니다. 로마숫자로는?',en:'In C major, G7 resolves deceptively (not to the tonic) to Abmaj7, whose root sits up a half step from the dominant. What is the Roman numeral?'},staff:drawStaff({cl:'treble',ns:["G4","B4","D5","F5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:130+i*4})),w:280}),audio:["G4","B4","D5","F5","Ab4","C5","Eb5","G5"],ans:'bVImaj7',opts:["VI-7","III-7","bVImaj7","bIImaj7"],terms:['deceptive_resolution'],why:{ko:'케이던스에서 가장 안정적인 두 음은 도(1도)와 솔(5도)입니다. 이 화음(bVImaj7)이 특별한 이유는 그 도(포함)와 솔을 여전히 품고 있어서, 귀에는 \'절반의 해결\'처럼 들리기 때문입니다. V7는 이런 식으로 총 7가지 경로로 기만적 해결을 할 수 있고, bVImaj7는 서브도미넌트 마이너 계열입니다.',en:'At a cadence, the two most stable pitches are degree 1 (do) and degree 5 (sol) of the key. This chord (bVImaj7) sounds like a partial resolution precisely because it still holds onto one or both of those pitches. V7 can resolve deceptively along seven such paths in total, and bVImaj7 belongs to the subdominant minor family.'}});
  add({ch:41,type:'mc',q:{ko:'F 장조에서 C7이 예상되는 으뜸화음 대신, 근음이 트라이톤인 Gbmaj7로 기만적으로 해결됩니다. 로마숫자로는?',en:'In F major, C7 resolves deceptively (not to the tonic) to Gbmaj7, whose root sits a tritone from the dominant. What is the Roman numeral?'},staff:drawStaff({cl:'treble',ns:["C4","E4","G4","Bb4"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:130+i*4})),w:280}),audio:["C4","E4","G4","Bb4","Gb4","Bb4","Db5","F5"],ans:'bIImaj7',opts:["bVIImaj7","III-7","bIImaj7","VI-7"],terms:['deceptive_resolution'],why:{ko:'케이던스에서 가장 안정적인 두 음은 도(1도)와 솔(5도)입니다. 이 화음(bIImaj7)이 특별한 이유는 그 도(포함)와 솔을 여전히 품고 있어서, 귀에는 \'절반의 해결\'처럼 들리기 때문입니다. V7는 이런 식으로 총 7가지 경로로 기만적 해결을 할 수 있고, bIImaj7는 서브도미넌트 마이너(변형) 계열입니다.',en:'At a cadence, the two most stable pitches are degree 1 (do) and degree 5 (sol) of the key. This chord (bIImaj7) sounds like a partial resolution precisely because it still holds onto one or both of those pitches. V7 can resolve deceptively along seven such paths in total, and bIImaj7 belongs to the subdominant minor family.'}});
  add({ch:41,type:'mc',q:{ko:'F 장조에서 C7이 예상되는 으뜸화음 대신, 근음이 반음 위인 Dbmaj7로 기만적으로 해결됩니다. 로마숫자로는?',en:'In F major, C7 resolves deceptively (not to the tonic) to Dbmaj7, whose root sits up a half step from the dominant. What is the Roman numeral?'},staff:drawStaff({cl:'treble',ns:["C4","E4","G4","Bb4"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:130+i*4})),w:280}),audio:["C4","E4","G4","Bb4","Db4","F4","Ab4","C5"],ans:'bVImaj7',opts:["bVIImaj7","III-7","VI-7","bVImaj7"],terms:['deceptive_resolution'],why:{ko:'케이던스에서 가장 안정적인 두 음은 도(1도)와 솔(5도)입니다. 이 화음(bVImaj7)이 특별한 이유는 그 도(포함)와 솔을 여전히 품고 있어서, 귀에는 \'절반의 해결\'처럼 들리기 때문입니다. V7는 이런 식으로 총 7가지 경로로 기만적 해결을 할 수 있고, bVImaj7는 서브도미넌트 마이너 계열입니다.',en:'At a cadence, the two most stable pitches are degree 1 (do) and degree 5 (sol) of the key. This chord (bVImaj7) sounds like a partial resolution precisely because it still holds onto one or both of those pitches. V7 can resolve deceptively along seven such paths in total, and bVImaj7 belongs to the subdominant minor family.'}});

  add({ch:41,type:'mc',q:{ko:'G 장조에서 D7이 예상되는 으뜸화음 대신, 근음이 트라이톤인 Abmaj7로 기만적으로 해결됩니다. 로마숫자로는?',en:'In G major, D7 resolves deceptively (not to the tonic) to Abmaj7, whose root sits a tritone from the dominant. What is the Roman numeral?'},staff:drawStaff({cl:'treble',ns:["D4","F#4","A4","C5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:130+i*4})),w:280}),audio:["D4","F#4","A4","C5","Ab4","C5","Eb5","G5"],ans:'bIImaj7',opts:["bIImaj7","III-7","#IV-7(b5)","bVIImaj7"],terms:['deceptive_resolution'],why:{ko:'케이던스에서 가장 안정적인 두 음은 도(1도)와 솔(5도)입니다. 이 화음(bIImaj7)이 특별한 이유는 그 도(포함)와 솔을 여전히 품고 있어서, 귀에는 \'절반의 해결\'처럼 들리기 때문입니다. V7는 이런 식으로 총 7가지 경로로 기만적 해결을 할 수 있고, bIImaj7는 서브도미넌트 마이너(변형) 계열입니다.',en:'At a cadence, the two most stable pitches are degree 1 (do) and degree 5 (sol) of the key. This chord (bIImaj7) sounds like a partial resolution precisely because it still holds onto one or both of those pitches. V7 can resolve deceptively along seven such paths in total, and bIImaj7 belongs to the subdominant minor family.'}});

  add({ch:41,type:'mc',q:{ko:'D 장조에서 A7이 예상되는 으뜸화음 대신, 근음이 반음 위인 Bbmaj7로 기만적으로 해결됩니다. 로마숫자로는?',en:'In D major, A7 resolves deceptively (not to the tonic) to Bbmaj7, whose root sits up a half step from the dominant. What is the Roman numeral?'},staff:drawStaff({cl:'treble',ns:["A4","C#5","E5","G5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:130+i*4})),w:280}),audio:["A4","C#5","E5","G5","Bb4","D5","F5","A5"],ans:'bVImaj7',opts:["bVImaj7","bVIImaj7","III-7","bIImaj7"],terms:['deceptive_resolution'],why:{ko:'케이던스에서 가장 안정적인 두 음은 도(1도)와 솔(5도)입니다. 이 화음(bVImaj7)이 특별한 이유는 그 도(포함)와 솔을 여전히 품고 있어서, 귀에는 \'절반의 해결\'처럼 들리기 때문입니다. V7는 이런 식으로 총 7가지 경로로 기만적 해결을 할 수 있고, bVImaj7는 서브도미넌트 마이너 계열입니다.',en:'At a cadence, the two most stable pitches are degree 1 (do) and degree 5 (sol) of the key. This chord (bVImaj7) sounds like a partial resolution precisely because it still holds onto one or both of those pitches. V7 can resolve deceptively along seven such paths in total, and bVImaj7 belongs to the subdominant minor family.'}});
  add({ch:41,type:'mc',q:{ko:'V7의 기만적 해결 화음들이 왜 완전히 다른 곳으로 가는데도 \'절반의 해결\'처럼 들리는지, 그 이유를 하나의 원리로 설명한다면?',en:'Why do V7\'s many different deceptive-resolution chords all still sound like a partial resolution? What single principle explains this?'},audio:[],ans:'그 화음이 도(1도)나 솔(5도) 중 하나 이상을 여전히 품고 있기 때문',opts:['그 화음이 도(1도)나 솔(5도) 중 하나 이상을 여전히 품고 있기 때문','모든 기만적 해결 화음이 단7화음이기 때문','근음이 항상 5도 아래로 움직이기 때문','텐션이 항상 자연음이기 때문'],terms:['deceptive_resolution'],why:{ko:'케이던스에서 귀에 가장 강하게 들리는 두 음은 도와 솔입니다. 목적지 화음이 무엇이든, 그 화음이 도나 솔 중 하나만 품고 있어도 귀는 \'절반은 해결됐다\'고 느낍니다. 화음 이름을 다 외우는 대신 이 질문 하나만 스스로 던지면 됩니다: 이 화음이 도나 솔을 담고 있는가?',en:'The two pitches the ear holds onto most strongly at a cadence are do and sol. Whatever the destination chord is, if it contains even one of those two pitches, the ear feels a partial resolution. Instead of memorizing every chord name, just ask one question: does this chord hold do or sol?'}});

  /* ── CH 42: Secondary Dominants Have Their Own Deceptive Resolutions (Harmony 4) ── */
  add({ch:42,type:'mc',q:{ko:'C 장조의 V7/II(A7)도 자기 목표(II) 기준으로 똑같은 6가지 기만적 해결 지도를 따를 수 있습니다. 근음이 단3도 아래인 F#m7로 갔다면, 이건 어떤 화음의 대역인가요?',en:'V7/II (A7) in C major can walk the exact same six-path deceptive-resolution map relative to its own target (II). If it moves down a minor 3rd to F#m7, which chord\'s substitute is this destination measured against?'},staff:drawStaff({cl:'treble',ns:["A4","C#5","E5","G5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:130+i*4})),w:280}),audio:["A4","C#5","E5","G5","F#4","A4","C#5","E5"],ans:'II',opts:["II","VI","I","IV"],terms:['deceptive_resolution','secondary_dominant'],why:{ko:'부속화음도 도미넌트인 이상, 자기 목표를 기준으로 똑같은 6가지 기만적 해결 지도를 그대로 옮겨 쓸 수 있습니다. 지난주(V7)의 지도를 그대로 V7/II에 대입하면 됩니다 — 다만 기준점이 으뜸음이 아니라 II일 뿐입니다.',en:'Since a secondary dominant is still a dominant, it can walk the exact same six-path deceptive-resolution map relative to its own target. Last week\'s map for V7 transplants directly onto V7/II -- the only difference is the reference point is II, not the tonic.'}});

  add({ch:42,type:'mc',q:{ko:'F 장조의 V7/II(D7)도 자기 목표(II) 기준으로 똑같은 6가지 기만적 해결 지도를 따를 수 있습니다. 근음이 단3도 위인 Fmaj7로 갔다면, 이건 어떤 화음의 대역인가요?',en:'V7/II (D7) in F major can walk the exact same six-path deceptive-resolution map relative to its own target (II). If it moves up a minor 3rd to Fmaj7, which chord\'s substitute is this destination measured against?'},staff:drawStaff({cl:'treble',ns:["D5","F#5","A5","C6"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:130+i*4})),w:280}),audio:["D5","F#5","A5","C6","F5","A5","C6","E6"],ans:'II',opts:["I","II","IV","VI"],terms:['deceptive_resolution','secondary_dominant'],why:{ko:'부속화음도 도미넌트인 이상, 자기 목표를 기준으로 똑같은 6가지 기만적 해결 지도를 그대로 옮겨 쓸 수 있습니다. 지난주(V7)의 지도를 그대로 V7/II에 대입하면 됩니다 — 다만 기준점이 으뜸음이 아니라 II일 뿐입니다.',en:'Since a secondary dominant is still a dominant, it can walk the exact same six-path deceptive-resolution map relative to its own target. Last week\'s map for V7 transplants directly onto V7/II -- the only difference is the reference point is II, not the tonic.'}});

  add({ch:42,type:'mc',q:{ko:'G 장조의 V7/V(A7)도 자기 목표(V) 기준으로 똑같은 6가지 기만적 해결 지도를 따를 수 있습니다. 근음이 장2도 위인 Bm7로 갔다면, 이건 어떤 화음의 대역인가요?',en:'V7/V (A7) in G major can walk the exact same six-path deceptive-resolution map relative to its own target (V). If it moves up a whole step to Bm7, which chord\'s substitute is this destination measured against?'},staff:drawStaff({cl:'treble',ns:["A5","C#6","E6","G6"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:130+i*4})),w:280}),audio:["A5","C#6","E6","G6","B5","D6","F#6","A6"],ans:'V',opts:["VI","V","I","IV"],terms:['deceptive_resolution','secondary_dominant'],why:{ko:'부속화음도 도미넌트인 이상, 자기 목표를 기준으로 똑같은 6가지 기만적 해결 지도를 그대로 옮겨 쓸 수 있습니다. 지난주(V7)의 지도를 그대로 V7/V에 대입하면 됩니다 — 다만 기준점이 으뜸음이 아니라 V일 뿐입니다.',en:'Since a secondary dominant is still a dominant, it can walk the exact same six-path deceptive-resolution map relative to its own target. Last week\'s map for V7 transplants directly onto V7/V -- the only difference is the reference point is V, not the tonic.'}});
