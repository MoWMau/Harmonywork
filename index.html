  add({ch:42,type:'mc',q:{ko:'C 장조의 V7/V(D7)도 자기 목표(V) 기준으로 똑같은 6가지 기만적 해결 지도를 따를 수 있습니다. 근음이 반음 위인 Ebmaj7로 갔다면, 이건 어떤 화음의 대역인가요?',en:'V7/V (D7) in C major can walk the exact same six-path deceptive-resolution map relative to its own target (V). If it moves up a half step to Ebmaj7, which chord\'s substitute is this destination measured against?'},staff:drawStaff({cl:'treble',ns:["D5","F#5","A5","C6"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:130+i*4})),w:280}),audio:["D5","F#5","A5","C6","Eb5","G5","Bb5","D6"],ans:'V',opts:["I","V","IV","VI"],terms:['deceptive_resolution','secondary_dominant'],why:{ko:'부속화음도 도미넌트인 이상, 자기 목표를 기준으로 똑같은 6가지 기만적 해결 지도를 그대로 옮겨 쓸 수 있습니다. 지난주(V7)의 지도를 그대로 V7/V에 대입하면 됩니다 — 다만 기준점이 으뜸음이 아니라 V일 뿐입니다.',en:'Since a secondary dominant is still a dominant, it can walk the exact same six-path deceptive-resolution map relative to its own target. Last week\'s map for V7 transplants directly onto V7/V -- the only difference is the reference point is V, not the tonic.'}});
  add({ch:42,type:'mc',q:{ko:'C 장조의 V7/V(D7)도 자기 목표(V) 기준으로 똑같은 6가지 기만적 해결 지도를 따를 수 있습니다. 근음이 으뜸음 기준 트라이톤(도미넌트 기준 반음 위)인 G#m7로 갔다면, 이건 어떤 화음의 대역인가요?',en:'V7/V (D7) in C major can walk the exact same six-path deceptive-resolution map relative to its own target (V). If it moves a tritone above the tonic (a half step above the dominant) to G#m7, which chord\'s substitute is this destination measured against?'},staff:drawStaff({cl:'treble',ns:["D5","F#5","A5","C6"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:130+i*4})),w:280}),audio:["D5","F#5","A5","C6","G#5","B5","D#6","F#6"],ans:'V',opts:["VI","IV","V","I"],terms:['deceptive_resolution','secondary_dominant'],why:{ko:'부속화음도 도미넌트인 이상, 자기 목표를 기준으로 똑같은 6가지 기만적 해결 지도를 그대로 옮겨 쓸 수 있습니다. 지난주(V7)의 지도를 그대로 V7/V에 대입하면 됩니다 — 다만 기준점이 으뜸음이 아니라 V일 뿐입니다.',en:'Since a secondary dominant is still a dominant, it can walk the exact same six-path deceptive-resolution map relative to its own target. Last week\'s map for V7 transplants directly onto V7/V -- the only difference is the reference point is V, not the tonic.'}});

  /* ── CH 43: The Three Functional Areas (Harmony 4) ── */
  add({ch:43,type:'mc',q:{ko:'C 장조에서 IIIm7는 Imaj7와 코드톤을 3개(E,G,B처럼) 공유해서 같은 기능군으로 묶입니다. 이 기능군의 이름은?',en:'In C major, IIIm7 shares three chord tones with Imaj7, placing them in the same functional area. What is that area called?'},staff:drawStaff({cl:'treble',ns:["E4","G4","B4","D5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["C4","E4","G4","B4","E4","G4","B4","D5"],ans:'토닉(tonic) 기능군',opts:['토닉(tonic) 기능군','서브도미넌트(subdominant) 기능군','도미넌트(dominant) 기능군','비도미넌트 기능 화음'],terms:['function','tonic'],why:{ko:'Imaj7(C,E,G,B)와 IIIm7(E,G,B,D)는 근음만 다르고 나머지 3개 음(E,G,B)이 완전히 같습니다. 이렇게 네 음 중 세 음을 공유하면 같은 기능군으로 묶이는데, I·III·VI가 토닉 기능군을 이룹니다.',en:'Imaj7 (C,E,G,B) and IIIm7 (E,G,B,D) differ only in root -- the other three notes (E,G,B) are identical. Sharing three of four tones like this groups chords into the same functional area; I, III, and VI together form the tonic area.'}});
  add({ch:43,type:'mc',q:{ko:'C 장조에서 IIm7는 IVmaj7와 코드톤 3개를 공유해서 같은 기능군으로 묶입니다. 이 기능군의 이름은?',en:'In C major, IIm7 shares three chord tones with IVmaj7, placing them in the same functional area. What is that area called?'},staff:drawStaff({cl:'treble',ns:["D4","F4","A4","C5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["F4","A4","C5","E5","D4","F4","A4","C5"],ans:'서브도미넌트(subdominant) 기능군',opts:['토닉(tonic) 기능군','서브도미넌트(subdominant) 기능군','도미넌트(dominant) 기능군','비도미넌트 기능 화음'],terms:['function','subdominant'],why:{ko:'IVmaj7와 IIm7도 마찬가지로 네 음 중 세 음(예: F,A,C)을 공유합니다. 이 원리 덕분에 IIm7가 ii-V-I에서 서브도미넌트로 기능할 수 있는 거예요.',en:'IVmaj7 and IIm7 likewise share three of four tones (e.g. F, A, C). This same principle is exactly why IIm7 can function as the subdominant in a ii-V-I progression.'}});
  add({ch:43,type:'mc',q:{ko:'C 장조에서 V7와 VIIm7(♭5)는 서로 코드톤을 공유하는 게 아니라, 대신 무엇을 공유해서 같은 기능군으로 묶이나요?',en:'In C major, V7 and VIIm7(b5) are grouped in the same functional area not by shared chord tones, but by sharing what?'},staff:drawStaff({cl:'treble',ns:["B4","D5","F5","A5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["G4","B4","D5","F5","B4","D5","F5","A5"],ans:'트라이톤(tritone)',opts:['트라이톤(tritone)','완전5도','장3도','근음 자체'],terms:['function','dominant_chord_modulation'],why:{ko:'토닉·서브도미넌트 기능군은 공통음 3개로 묶이지만, 도미넌트 기능군(V7과 VIIm7♭5)은 대신 트라이톤을 공유해서 묶입니다 — 바로 그 트라이톤이 강한 해결 욕구를 만드는 힘의 원천입니다.',en:'While the tonic and subdominant areas are bound by three shared chord tones, the dominant area (V7 and VIIm7b5) is instead bound by a shared tritone -- and that very tritone is the source of the strong pull toward resolution.'}});

  add({ch:43,type:'mc',q:{ko:'G 장조에서 IIIm7는 Imaj7와 코드톤을 3개(E,G,B처럼) 공유해서 같은 기능군으로 묶입니다. 이 기능군의 이름은?',en:'In G major, IIIm7 shares three chord tones with Imaj7, placing them in the same functional area. What is that area called?'},staff:drawStaff({cl:'treble',ns:["B4","D5","F#5","A5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["G4","B4","D5","F#5","B4","D5","F#5","A5"],ans:'토닉(tonic) 기능군',opts:['토닉(tonic) 기능군','서브도미넌트(subdominant) 기능군','도미넌트(dominant) 기능군','비도미넌트 기능 화음'],terms:['function','tonic'],why:{ko:'Imaj7(C,E,G,B)와 IIIm7(E,G,B,D)는 근음만 다르고 나머지 3개 음(E,G,B)이 완전히 같습니다. 이렇게 네 음 중 세 음을 공유하면 같은 기능군으로 묶이는데, I·III·VI가 토닉 기능군을 이룹니다.',en:'Imaj7 (C,E,G,B) and IIIm7 (E,G,B,D) differ only in root -- the other three notes (E,G,B) are identical. Sharing three of four tones like this groups chords into the same functional area; I, III, and VI together form the tonic area.'}});

  add({ch:43,type:'mc',q:{ko:'G 장조에서 V7와 VIIm7(♭5)는 서로 코드톤을 공유하는 게 아니라, 대신 무엇을 공유해서 같은 기능군으로 묶이나요?',en:'In G major, V7 and VIIm7(b5) are grouped in the same functional area not by shared chord tones, but by sharing what?'},staff:drawStaff({cl:'treble',ns:["F#5","A5","C6","E6"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["D5","F#5","A5","C6","F#5","A5","C6","E6"],ans:'트라이톤(tritone)',opts:['트라이톤(tritone)','완전5도','장3도','근음 자체'],terms:['function','dominant_chord_modulation'],why:{ko:'토닉·서브도미넌트 기능군은 공통음 3개로 묶이지만, 도미넌트 기능군(V7과 VIIm7♭5)은 대신 트라이톤을 공유해서 묶입니다 — 바로 그 트라이톤이 강한 해결 욕구를 만드는 힘의 원천입니다.',en:'While the tonic and subdominant areas are bound by three shared chord tones, the dominant area (V7 and VIIm7b5) is instead bound by a shared tritone -- and that very tritone is the source of the strong pull toward resolution.'}});

  /* -- CH 44: The Chameleon Chord -- Dominant Functions in Minor Keys (Harmony 4) -- */
  add({ch:44,type:'mc',q:{ko:'B 단조에서, D7은 완전5도 아래(G)로도, 반음 아래(C#)로도 해결될 수 있는 카멜레온 화음입니다. 두 목표(G와 C#) 사이의 음정은?',en:'In B minor, D7 is a chameleon chord -- it can resolve down a 5th to G or down a half step to C#. What interval separates the two targets (G and C#)?'},staff:drawStaff({cl:'treble',ns:["D4","F#4","A4","C5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["D4","F#4","A4","C5"],ans:'트라이톤(tritone)',opts:['트라이톤(tritone)','장2도','단3도','완전4도'],terms:['chameleon_chord'],why:{ko:'완전5도(7반음)와 반음(1반음)의 차이는 정확히 6반음, 즉 트라이톤입니다. 그래서 두 목표가 트라이톤만큼 떨어져 있을 때마다, 그 사이의 화음 하나가 양쪽 모두의 도미넌트 역할(V7/VI 이자 SubV7/II)을 동시에 할 수 있습니다.',en:'The gap between a perfect 5th (7 semitones) and a half step (1 semitone) is exactly 6 semitones -- a tritone. So whenever two targets sit a tritone apart, the single chord between them can serve as the dominant of both at once (here, both V7/VI and SubV7/II).'}});
  add({ch:44,type:'mc',q:{ko:'C 단조에서, Eb7은 완전5도 아래(Ab)로도, 반음 아래(D)로도 해결될 수 있는 카멜레온 화음입니다. 두 목표(Ab와 D) 사이의 음정은?',en:'In C minor, Eb7 is a chameleon chord -- it can resolve down a 5th to Ab or down a half step to D. What interval separates the two targets (Ab and D)?'},staff:drawStaff({cl:'treble',ns:["Eb4","G4","Bb4","Db5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["Eb4","G4","Bb4","Db5"],ans:'트라이톤(tritone)',opts:['트라이톤(tritone)','장2도','단3도','완전4도'],terms:['chameleon_chord'],why:{ko:'완전5도(7반음)와 반음(1반음)의 차이는 정확히 6반음, 즉 트라이톤입니다. 그래서 두 목표가 트라이톤만큼 떨어져 있을 때마다, 그 사이의 화음 하나가 양쪽 모두의 도미넌트 역할(V7/bVI 이자 SubV7/II)을 동시에 할 수 있습니다.',en:'The gap between a perfect 5th (7 semitones) and a half step (1 semitone) is exactly 6 semitones -- a tritone. So whenever two targets sit a tritone apart, the single chord between them can serve as the dominant of both at once (here, both V7/bVI and SubV7/II).'}});
  add({ch:44,type:'mc',q:{ko:'D 단조에서, F7은 완전5도 아래(Bb)로도, 반음 아래(E)로도 해결될 수 있는 카멜레온 화음입니다. 두 목표(Bb와 E) 사이의 음정은?',en:'In D minor, F7 is a chameleon chord -- it can resolve down a 5th to Bb or down a half step to E. What interval separates the two targets (Bb and E)?'},staff:drawStaff({cl:'treble',ns:["F4","A4","C5","Eb5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["F4","A4","C5","Eb5"],ans:'트라이톤(tritone)',opts:['트라이톤(tritone)','장2도','단3도','완전4도'],terms:['chameleon_chord'],why:{ko:'완전5도(7반음)와 반음(1반음)의 차이는 정확히 6반음, 즉 트라이톤입니다. 그래서 두 목표가 트라이톤만큼 떨어져 있을 때마다, 그 사이의 화음 하나가 양쪽 모두의 도미넌트 역할(V7/bVI 이자 SubV7/II)을 동시에 할 수 있습니다.',en:'The gap between a perfect 5th (7 semitones) and a half step (1 semitone) is exactly 6 semitones -- a tritone. So whenever two targets sit a tritone apart, the single chord between them can serve as the dominant of both at once (here, both V7/bVI and SubV7/II).'}});
  add({ch:44,type:'mc',q:{ko:'A 단조에서, C7은 완전5도 아래(F)로도, 반음 아래(B)로도 해결될 수 있는 카멜레온 화음입니다. 두 목표(F와 B) 사이의 음정은?',en:'In A minor, C7 is a chameleon chord -- it can resolve down a 5th to F or down a half step to B. What interval separates the two targets (F and B)?'},staff:drawStaff({cl:'treble',ns:["C4","E4","G4","Bb4"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["C4","E4","G4","Bb4"],ans:'트라이톤(tritone)',opts:['트라이톤(tritone)','장2도','단3도','완전4도'],terms:['chameleon_chord'],why:{ko:'완전5도(7반음)와 반음(1반음)의 차이는 정확히 6반음, 즉 트라이톤입니다. 그래서 두 목표가 트라이톤만큼 떨어져 있을 때마다, 그 사이의 화음 하나가 양쪽 모두의 도미넌트 역할(V7/bVI 이자 SubV7/II)을 동시에 할 수 있습니다.',en:'The gap between a perfect 5th (7 semitones) and a half step (1 semitone) is exactly 6 semitones -- a tritone. So whenever two targets sit a tritone apart, the single chord between them can serve as the dominant of both at once (here, both V7/bVI and SubV7/II).'}});
  add({ch:44,type:'mc',q:{ko:'B단조에서 D7 위에 자연스러운 지나가는음으로 G내추럴을 쓰면 어느 쪽 해석 쪽으로 기울까요?',en:'In B minor, using a natural G as a passing tone over D7 leans toward which reading?'},audio:[],ans:'V7/VI (G로 해결)',opts:['V7/VI (G로 해결)','SubV7/II (C#으로 해결)','피벗 화음','확장 도미넌트'],terms:['chameleon_chord'],why:{ko:'G내추럴은 목표 화음 Gmaj7의 근음을 미리 들려주는 음이라 V7/VI 쪽으로 귀를 이끕니다. 반대로 G#(화성/가락단음계 음)을 쓰면 SubV7/II 쪽으로 기울어요 — 단 한 음이 방향을 결정합니다.',en:'A natural G previews the root of the target Gmaj7, leaning the ear toward V7/VI. Using G# (from the harmonic/melodic minor) instead leans toward SubV7/II -- a single grazing note decides the direction.'}});
  add({ch:44,type:'mc',q:{ko:'B단조에서 VII7(A7)은 완전5도 아래(D, ♭III)로도 움직일 수 있어 대리도미넌트처럼 보입니다. 그런데 왜 진짜 대리도미넌트가 아닌가요?',en:'In B minor, VII7 (A7) can move down a 5th to D (bIII), which looks like a substitute dominant. Why is it NOT actually one?'},audio:[],ans:'근음 A가 이미 자연단음계 안에 있어서, 조성 밖의 변화음이 아니기 때문',opts:['근음 A가 이미 자연단음계 안에 있어서, 조성 밖의 변화음이 아니기 때문','7화음이 아니라서','장조에서만 대리도미넌트가 가능해서','5도 관계가 아니라서'],terms:['chameleon_chord','substitute_dominant'],why:{ko:'대리도미넌트가 되려면 조성 밖의 변화음(반음계적 근음)을 가져야 합니다. A7의 근음 A는 자연단음계에 이미 있는 다이아토닉 음이라, 겉모습은 대리도미넌트 같아도 정의상 성립하지 않습니다.',en:'To be a true substitute dominant, a chord needs a chromatic root from outside the key. A7\'s root, A, is already diatonic to the natural minor scale, so despite looking like one, it does not qualify by definition.'}});


  /* -- CH 45: The Controversial Four & Blue-Note-Rooted Dominants (Harmony 4) -- */
  add({ch:45,type:'mc',q:{ko:'C 장조에서 bVI7(Ab7)은 로마숫자만 보면 낯설어 보이지만, 실제로는 무엇의 우연의 일치인가요?',en:'In C major, bVI7 (Ab7) looks unusual by Roman numeral alone, but is actually a coincidence with what?'},staff:drawStaff({cl:'treble',ns:["Ab4","C5","Eb5","Gb5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["Ab4","C5","Eb5","Gb5"],ans:'SubV7/V (D7의 트라이톤 대리)',opts:["V7/V (G의 세컨더리 도미넌트)","SubV7/V (D7의 트라이톤 대리)","V7/II (Dm7의 세컨더리 도미넌트)","V7/VI (Am7의 세컨더리 도미넌트)"],terms:['nondominant_dominant'],why:{ko:'bVI7는 다이아토닉과 무관해 보이지만, 실제로는 SubV7/V (D7의 트라이톤 대리)와 정확히 같은 화음입니다. 이렇게 "논란의 4화음"은 전부 세컨더리·대리 도미넌트와 우연히 겹치는 경우들입니다.',en:'bVI7 looks unrelated to the diatonic key, but it is exactly the same chord as SubV7/V (D7의 트라이톤 대리). All four "controversial" chords are cases where the Roman numeral coincides exactly with a secondary or substitute dominant.'}});
  add({ch:45,type:'mc',q:{ko:'C 장조에서 II7(D7)은 로마숫자만 보면 낯설어 보이지만, 실제로는 무엇의 우연의 일치인가요?',en:'In C major, II7 (D7) looks unusual by Roman numeral alone, but is actually a coincidence with what?'},staff:drawStaff({cl:'treble',ns:["D4","F#4","A4","C5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["D4","F#4","A4","C5"],ans:'V7/V (G의 세컨더리 도미넌트)',opts:["V7/V (G의 세컨더리 도미넌트)","V7/II (Dm7의 세컨더리 도미넌트)","SubV7/V (D7의 트라이톤 대리)","V7/VI (Am7의 세컨더리 도미넌트)"],terms:['nondominant_dominant'],why:{ko:'II7는 다이아토닉과 무관해 보이지만, 실제로는 V7/V (G의 세컨더리 도미넌트)와 정확히 같은 화음입니다. 이렇게 "논란의 4화음"은 전부 세컨더리·대리 도미넌트와 우연히 겹치는 경우들입니다.',en:'II7 looks unrelated to the diatonic key, but it is exactly the same chord as V7/V (G의 세컨더리 도미넌트). All four "controversial" chords are cases where the Roman numeral coincides exactly with a secondary or substitute dominant.'}});
  add({ch:45,type:'mc',q:{ko:'C 장조에서 VI7(A7)은 로마숫자만 보면 낯설어 보이지만, 실제로는 무엇의 우연의 일치인가요?',en:'In C major, VI7 (A7) looks unusual by Roman numeral alone, but is actually a coincidence with what?'},staff:drawStaff({cl:'treble',ns:["A3","C#4","E4","G4"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["A3","C#4","E4","G4"],ans:'V7/II (Dm7의 세컨더리 도미넌트)',opts:["SubV7/V (D7의 트라이톤 대리)","V7/VI (Am7의 세컨더리 도미넌트)","V7/V (G의 세컨더리 도미넌트)","V7/II (Dm7의 세컨더리 도미넌트)"],terms:['nondominant_dominant'],why:{ko:'VI7는 다이아토닉과 무관해 보이지만, 실제로는 V7/II (Dm7의 세컨더리 도미넌트)와 정확히 같은 화음입니다. 이렇게 "논란의 4화음"은 전부 세컨더리·대리 도미넌트와 우연히 겹치는 경우들입니다.',en:'VI7 looks unrelated to the diatonic key, but it is exactly the same chord as V7/II (Dm7의 세컨더리 도미넌트). All four "controversial" chords are cases where the Roman numeral coincides exactly with a secondary or substitute dominant.'}});
  add({ch:45,type:'mc',q:{ko:'C 장조에서 III7(E7)은 로마숫자만 보면 낯설어 보이지만, 실제로는 무엇의 우연의 일치인가요?',en:'In C major, III7 (E7) looks unusual by Roman numeral alone, but is actually a coincidence with what?'},staff:drawStaff({cl:'treble',ns:["E4","G#4","B4","D5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["E4","G#4","B4","D5"],ans:'V7/VI (Am7의 세컨더리 도미넌트)',opts:["SubV7/V (D7의 트라이톤 대리)","V7/II (Dm7의 세컨더리 도미넌트)","V7/V (G의 세컨더리 도미넌트)","V7/VI (Am7의 세컨더리 도미넌트)"],terms:['nondominant_dominant'],why:{ko:'III7는 다이아토닉과 무관해 보이지만, 실제로는 V7/VI (Am7의 세컨더리 도미넌트)와 정확히 같은 화음입니다. 이렇게 "논란의 4화음"은 전부 세컨더리·대리 도미넌트와 우연히 겹치는 경우들입니다.',en:'III7 looks unrelated to the diatonic key, but it is exactly the same chord as V7/VI (Am7의 세컨더리 도미넌트). All four "controversial" chords are cases where the Roman numeral coincides exactly with a secondary or substitute dominant.'}});
  add({ch:45,type:'mc',q:{ko:'C 장조에서 bIII7(Eb7)는 블루노트(♭3,♭5,♭7) 위에 세운 딸림7화음입니다. 앞선 논란의 4화음과 무엇이 다른가요?',en:'In C major, bIII7 (Eb7) is a dominant 7th built on a blue note (b3, b5, or b7). How is it different from the "controversial four" chords?'},staff:drawStaff({cl:'treble',ns:["Eb4","G4","Bb4","Db5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["Eb4","G4","Bb4","Db5"],ans:'세컨더리·대리 도미넌트와 우연히 겹치는 논리적 근거가 없다',opts:['세컨더리·대리 도미넌트와 우연히 겹치는 논리적 근거가 없다','V7/V와 정확히 같다','대리도미넌트의 트라이톤 대체다','다이아토닉 화음이다'],terms:['blue_note_dominant'],why:{ko:'논란의 4화음은 전부 세컨더리·대리 도미넌트와 겹치는 논리적 이유가 있었지만, ♭III7·♭V7은 그런 근거가 없습니다. 그냥 블루노트 근음 위에 순수한 평행이동(색채 전환)으로 쓰이는 화음입니다.',en:'The controversial four all had a logical reason for coinciding with a secondary or substitute dominant, but bIII7 and bV7 have no such reason -- they are simply parallel-motion color chords rooted on blue notes.'}});
  add({ch:45,type:'mc',q:{ko:'C 장조에서 bV7(Gb7)는 블루노트(♭3,♭5,♭7) 위에 세운 딸림7화음입니다. 앞선 논란의 4화음과 무엇이 다른가요?',en:'In C major, bV7 (Gb7) is a dominant 7th built on a blue note (b3, b5, or b7). How is it different from the "controversial four" chords?'},staff:drawStaff({cl:'treble',ns:["Gb4","Bb4","Db5","Fb5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["Gb4","Bb4","Db5","Fb5"],ans:'세컨더리·대리 도미넌트와 우연히 겹치는 논리적 근거가 없다',opts:['세컨더리·대리 도미넌트와 우연히 겹치는 논리적 근거가 없다','V7/V와 정확히 같다','대리도미넌트의 트라이톤 대체다','다이아토닉 화음이다'],terms:['blue_note_dominant'],why:{ko:'논란의 4화음은 전부 세컨더리·대리 도미넌트와 겹치는 논리적 이유가 있었지만, ♭III7·♭V7은 그런 근거가 없습니다. 그냥 블루노트 근음 위에 순수한 평행이동(색채 전환)으로 쓰이는 화음입니다.',en:'The controversial four all had a logical reason for coinciding with a secondary or substitute dominant, but bIII7 and bV7 have no such reason -- they are simply parallel-motion color chords rooted on blue notes.'}});

  add({ch:45,type:'mc',q:{ko:'C 장조에서 ♭VI7(A♭7), II7(D7), 그리고 #IV−7(♭5)(F#−7♭5)는 놀랍게도 무엇을 공유하나요?',en:'In C major, bVI7 (Ab7), II7 (D7), and #IV-7(b5) (F#-7b5) surprisingly share what?'},audio:[],ans:'완전히 똑같은 트라이톤(C–G♭/F#)',opts:['완전히 똑같은 트라이톤(C–G♭/F#)','같은 근음','같은 텐션 개수','아무것도 공유하지 않는다'],terms:['nondominant_dominant','substitute_dominant'],why:{ko:'A♭7의 트라이톤(3음–♭7음)은 C–G♭이고, D7의 트라이톤(3음–♭7음)은 F#–C — G♭과 F#은 같은 음입니다! A♭과 D가 트라이톤 관계(대리도미넌트 관계)라 이렇게 겹칩니다. 세 화음 모두 같은 트라이톤을 공유하니, 서로 대신 쓰일 수 있어요.',en:'Ab7\'s tritone (3rd-b7th) is C-Gb, and D7\'s tritone (3rd-b7th) is F#-C -- Gb and F# are the same pitch! Because Ab and D are a tritone apart (a substitute-dominant relationship), all three chords converge on the identical tritone and can stand in for one another.'}});

  /* -- CH 46: Four Modal Interchange Borrowing Scenarios (Harmony 4) -- */
  add({ch:46,type:'mc',q:{ko:'C 장조에서 IV7이 차용되면 보사노바풍 색채를 냅니다. 이 화음은 C의 어느 모드에서 빌려온 건가요?',en:'In C major, borrowing IV7 creates a bossa-nova-like color. Which of C\'s modes is this chord borrowed from?'},staff:drawStaff({cl:'treble',ns:["F4","A4","C5","Eb5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["F4","A4","C5","Eb5"],ans:'도리안(Dorian)',opts:["도리안(Dorian)","프리지안(Phrygian)","믹소리디안(Mixolydian)","리디안(Lydian)"],terms:['modal_interchange']});
  add({ch:46,type:'mc',q:{ko:'C 장조에서 bIImaj7이 차용되면 가장 어두운 차용 화음 중 하나를 냅니다. 이 화음은 C의 어느 모드에서 빌려온 건가요?',en:'In C major, borrowing bIImaj7 creates one of the darkest borrowed chords. Which of C\'s modes is this chord borrowed from?'},staff:drawStaff({cl:'treble',ns:["Db4","F4","Ab4","C5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["Db4","F4","Ab4","C5"],ans:'프리지안(Phrygian)',opts:["프리지안(Phrygian)","도리안(Dorian)","믹소리디안(Mixolydian)","리디안(Lydian)"],terms:['modal_interchange']});
  add({ch:46,type:'mc',q:{ko:'C 장조에서 bVIImaj7이 차용되면 \'블루스\'풍 색채, 가장 온화한 차용를 냅니다. 이 화음은 C의 어느 모드에서 빌려온 건가요?',en:'In C major, borrowing bVIImaj7 creates a "bluesy" color, the mildest borrowing. Which of C\'s modes is this chord borrowed from?'},staff:drawStaff({cl:'treble',ns:["Bb4","D5","F5","A5"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["Bb4","D5","F5","A5"],ans:'믹소리디안(Mixolydian)',opts:["믹소리디안(Mixolydian)","프리지안(Phrygian)","도리안(Dorian)","리디안(Lydian)"],terms:['modal_interchange']});
  add({ch:46,type:'mc',q:{ko:'C 리디안을 빌려오면 Cmaj7 위에 어떤 텐션들이 생기나요? (D장3화음을 어퍼 스트럭처로 얹는 방식으로 한 번에 표현)',en:'Borrowing C Lydian over Cmaj7 creates which tensions? (expressed in one shape via a D major triad as upper structure)'},staff:grandStaff(['D5','F#5','A5'],'C3',200),audio:['C3','D5','F#5','A5'],ans:'9, #11, 13',opts:['9, #11, 13','b9, #9, b13','9, 11, 13','b9, #11, b13'],terms:['modal_interchange','upper_structure_triad'],why:{ko:'D장3화음(D,F#,A)은 C 위에서 각각 9음, #11음, 13음이 됩니다. 리디안의 색채(#11) 하나를 텐션 3개를 한 손모양으로 담아내는 실용적인 방법이에요.',en:'A D major triad (D, F#, A) becomes the 9th, #11th, and 13th over C. This is a practical way to capture Lydian\'s signature #11 color -- along with 9 and 13 -- all in a single hand shape.'}});
  add({ch:46,type:'mc',q:{ko:'C 에올리안(자연단조)이 C 도리안에서 빌려오면, IIm7♭5가 무엇으로 바뀌나요?',en:'When C Aeolian (natural minor) borrows from C Dorian, what does IIm7b5 become?'},audio:[],ans:'IIm7 (♭5가 사라짐)',opts:['IIm7 (♭5가 사라짐)','IImaj7','II7','바뀌지 않는다'],terms:['modal_interchange'],why:{ko:'도리안은 자연단조보다 6음이 반음 높아서, 그 위에 쌓은 2음 화음의 5음이 완전5도가 되어 ♭5가 사라집니다. 악보에 IIm7♭5 대신 그냥 IIm7이라고 쓰여 있다면, 이 도리안 차용의 신호일 수 있어요.',en:'Dorian raises the 6th a half step compared to natural minor, so the 5th of the chord built on the 2nd degree becomes a perfect 5th, and the b5 disappears. If a score writes plain IIm7 instead of IIm7b5, that can be a signal of this Dorian borrowing.'}});

  /* -- CH 48: Cooperative vs Bitonal Polychords (Harmony 4) -- */
  add({ch:48,type:'mc',q:{ko:'D/C 폴리코드 — 위 3화음의 음들을 아래 근음 기준으로 계산하면 9, #11, 13가 나옵니다. 이 폴리코드는 어느 쪽인가요?',en:'D/C polychord -- measuring the upper triad against the lower root gives 9, #11, 13. Which type of polychord is this?'},staff:grandStaff(["D4","F#4","A4"],'C3',200),audio:["C3","D4","F#4","A4"],ans:'협력형(cooperative)',opts:['협력형(cooperative)','바이토널(bitonal)'],terms:['polychord'],why:{ko:'계산 결과가 깨끗한 텐션 조합(9,#11,13)으로 정리되면 협력형 폴리코드입니다. 사실 어퍼 스트럭처 트라이어드는 이런 협력형 폴리코드의 특수한 경우였던 거예요.',en:'When the calculation resolves cleanly into a familiar tension combination (9, #11, 13), that is a cooperative polychord -- in fact, the upper structure triad was always a special case of exactly this.'}});
  add({ch:48,type:'mc',q:{ko:'G/F 폴리코드 — 위 3화음의 음들을 아래 근음 기준으로 계산하면 9, #11, 13가 나옵니다. 이 폴리코드는 어느 쪽인가요?',en:'G/F polychord -- measuring the upper triad against the lower root gives 9, #11, 13. Which type of polychord is this?'},staff:grandStaff(["G3","B3","D4"],'F2',200),audio:["F2","G3","B3","D4"],ans:'협력형(cooperative)',opts:['협력형(cooperative)','바이토널(bitonal)'],terms:['polychord'],why:{ko:'계산 결과가 깨끗한 텐션 조합(9,#11,13)으로 정리되면 협력형 폴리코드입니다. 사실 어퍼 스트럭처 트라이어드는 이런 협력형 폴리코드의 특수한 경우였던 거예요.',en:'When the calculation resolves cleanly into a familiar tension combination (9, #11, 13), that is a cooperative polychord -- in fact, the upper structure triad was always a special case of exactly this.'}});
  add({ch:48,type:'mc',q:{ko:'A/G 폴리코드 — 위 3화음의 음들을 아래 근음 기준으로 계산하면 9, #11, 13가 나옵니다. 이 폴리코드는 어느 쪽인가요?',en:'A/G polychord -- measuring the upper triad against the lower root gives 9, #11, 13. Which type of polychord is this?'},staff:grandStaff(["A3","C#4","E4"],'G2',200),audio:["G2","A3","C#4","E4"],ans:'협력형(cooperative)',opts:['협력형(cooperative)','바이토널(bitonal)'],terms:['polychord'],why:{ko:'계산 결과가 깨끗한 텐션 조합(9,#11,13)으로 정리되면 협력형 폴리코드입니다. 사실 어퍼 스트럭처 트라이어드는 이런 협력형 폴리코드의 특수한 경우였던 거예요.',en:'When the calculation resolves cleanly into a familiar tension combination (9, #11, 13), that is a cooperative polychord -- in fact, the upper structure triad was always a special case of exactly this.'}});
  add({ch:48,type:'mc',q:{ko:'F#/C 폴리코드 — 위 3화음의 음들을 아래 근음 기준으로 계산하면 b9, #11(트라이톤), b7가 나옵니다. 이 폴리코드는 어느 쪽인가요?',en:'F#/C polychord -- measuring the upper triad against the lower root gives b9, #11(트라이톤), b7. Which type of polychord is this?'},staff:grandStaff(["F#4","A#4","C#5"],'C3',200),audio:["C3","F#4","A#4","C#5"],ans:'바이토널(bitonal)',opts:['협력형(cooperative)','바이토널(bitonal)'],terms:['polychord'],why:{ko:'♭9와 #11(트라이톤 포함)이 함께 나오는 건 평소라면 피하는 조합입니다. 이렇게 두 화성이 서로 부딪히며 각자의 정체성을 유지하면 바이토널 폴리코드입니다.',en:'b9 and #11 (which includes a tritone) appearing together is normally an avoided combination. When the two harmonies collide and each keeps its own identity like this, that is a bitonal polychord.'}});
  add({ch:48,type:'mc',q:{ko:'B/F 폴리코드 — 위 3화음의 음들을 아래 근음 기준으로 계산하면 b9, #11(트라이톤), b7가 나옵니다. 이 폴리코드는 어느 쪽인가요?',en:'B/F polychord -- measuring the upper triad against the lower root gives b9, #11(트라이톤), b7. Which type of polychord is this?'},staff:grandStaff(["B3","D#4","F#4"],'F2',200),audio:["F2","B3","D#4","F#4"],ans:'바이토널(bitonal)',opts:['협력형(cooperative)','바이토널(bitonal)'],terms:['polychord'],why:{ko:'♭9와 #11(트라이톤 포함)이 함께 나오는 건 평소라면 피하는 조합입니다. 이렇게 두 화성이 서로 부딪히며 각자의 정체성을 유지하면 바이토널 폴리코드입니다.',en:'b9 and #11 (which includes a tritone) appearing together is normally an avoided combination. When the two harmonies collide and each keeps its own identity like this, that is a bitonal polychord.'}});

  /* -- CH 49: Constant Structure -- Chromatic Movement & Whole-Tone Division (Harmony 4) -- */
  add({ch:49,type:'mc',q:{ko:'D-11 화음이 구조를 그대로 유지한 채 반음 위로 옮겨져 Eb-11이 됩니다. 이런 진행에는 어떤 기능 라벨(토닉/도미넌트 등)이 붙나요?',en:'D-11 shifts up a half step with its structure unchanged, becoming Eb-11. What functional label (tonic/dominant/etc.) applies to this motion?'},staff:drawStaff({cl:'treble',ns:["Eb3","Gb3","Db4","Ab4","F4"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["D3","F3","C4","G4","E4","Eb3","Gb3","Db4","Ab4","F4"],ans:'라벨 없음 (컨스턴트 스트럭처)',opts:['라벨 없음 (컨스턴트 스트럭처)','서브도미넌트','도미넌트','피벗 화음'],terms:['constant_structure'],why:{ko:'"So What", "Impressions" 같은 곡들에 나오는 이 진행은 화음이 그저 같은 모양으로 반음 미끄러지듯 이동할 뿐, 토닉이나 도미넌트 같은 기능 라벨이 아예 붙지 않습니다.',en:'Heard in tunes like "So What" and "Impressions," this motion is just the same shape sliding by half step -- no functional label like tonic or dominant applies at all.'}});
  add({ch:49,type:'mc',q:{ko:'E-11 화음이 구조를 그대로 유지한 채 반음 위로 옮겨져 F-11이 됩니다. 이런 진행에는 어떤 기능 라벨(토닉/도미넌트 등)이 붙나요?',en:'E-11 shifts up a half step with its structure unchanged, becoming F-11. What functional label (tonic/dominant/etc.) applies to this motion?'},staff:drawStaff({cl:'treble',ns:["F3","Ab3","Eb4","Bb4","G4"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["E3","G3","D4","A4","F#4","F3","Ab3","Eb4","Bb4","G4"],ans:'라벨 없음 (컨스턴트 스트럭처)',opts:['라벨 없음 (컨스턴트 스트럭처)','서브도미넌트','도미넌트','피벗 화음'],terms:['constant_structure'],why:{ko:'"So What", "Impressions" 같은 곡들에 나오는 이 진행은 화음이 그저 같은 모양으로 반음 미끄러지듯 이동할 뿐, 토닉이나 도미넌트 같은 기능 라벨이 아예 붙지 않습니다.',en:'Heard in tunes like "So What" and "Impressions," this motion is just the same shape sliding by half step -- no functional label like tonic or dominant applies at all.'}});
  add({ch:49,type:'mc',q:{ko:'G-11 화음이 구조를 그대로 유지한 채 반음 위로 옮겨져 Ab-11이 됩니다. 이런 진행에는 어떤 기능 라벨(토닉/도미넌트 등)이 붙나요?',en:'G-11 shifts up a half step with its structure unchanged, becoming Ab-11. What functional label (tonic/dominant/etc.) applies to this motion?'},staff:drawStaff({cl:'treble',ns:["Ab3","Cb4","Gb4","Db5","Bb4"].map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),audio:["G3","Bb3","F4","C5","A4","Ab3","Cb4","Gb4","Db5","Bb4"],ans:'라벨 없음 (컨스턴트 스트럭처)',opts:['라벨 없음 (컨스턴트 스트럭처)','서브도미넌트','도미넌트','피벗 화음'],terms:['constant_structure'],why:{ko:'"So What", "Impressions" 같은 곡들에 나오는 이 진행은 화음이 그저 같은 모양으로 반음 미끄러지듯 이동할 뿐, 토닉이나 도미넌트 같은 기능 라벨이 아예 붙지 않습니다.',en:'Heard in tunes like "So What" and "Impressions," this motion is just the same shape sliding by half step -- no functional label like tonic or dominant applies at all.'}});
  add({ch:49,type:'write',q:{ko:'C부터 온음(장2도)씩 6등분한 컨스턴트 스트럭처 근음렬을 쓰세요 (=온음음계).',en:'Write the constant-structure root sequence dividing the octave into 6 equal whole-tone steps starting from C (this is the whole-tone scale):'},clef:'treble',given:['C4'],givenX:80,ans:["C4","D4","E4","F#4","G#4","A#4"],audio:["C4","D4","E4","F#4","G#4","A#4"],terms:['constant_structure','symmetric_division'],why:{ko:'장3도로 나누면 3등분(3개 근음), 단3도로 나누면 4등분(4개 근음), 온음으로 나누면 옥타브를 정확히 6등분합니다 — 이 여섯 근음이 바로 온음음계 자체예요.',en:'Dividing by major 3rds gives 3 equal parts, by minor 3rds gives 4, and by whole tones gives exactly 6 equal parts -- these six roots are the whole-tone scale itself.'}});
  add({ch:49,type:'write',q:{ko:'D부터 온음(장2도)씩 6등분한 컨스턴트 스트럭처 근음렬을 쓰세요 (=온음음계).',en:'Write the constant-structure root sequence dividing the octave into 6 equal whole-tone steps starting from D (this is the whole-tone scale):'},clef:'treble',given:['D4'],givenX:80,ans:["D4","E4","F#4","G#4","A#4","B#4"],audio:["D4","E4","F#4","G#4","A#4","B#4"],terms:['constant_structure','symmetric_division'],why:{ko:'장3도로 나누면 3등분(3개 근음), 단3도로 나누면 4등분(4개 근음), 온음으로 나누면 옥타브를 정확히 6등분합니다 — 이 여섯 근음이 바로 온음음계 자체예요.',en:'Dividing by major 3rds gives 3 equal parts, by minor 3rds gives 4, and by whole tones gives exactly 6 equal parts -- these six roots are the whole-tone scale itself.'}});
  add({ch:49,type:'write',q:{ko:'E부터 온음(장2도)씩 6등분한 컨스턴트 스트럭처 근음렬을 쓰세요 (=온음음계).',en:'Write the constant-structure root sequence dividing the octave into 6 equal whole-tone steps starting from E (this is the whole-tone scale):'},clef:'treble',given:['E4'],givenX:80,ans:["E4","F#4","G#4","A#4","B#4","C##5"],audio:["E4","F#4","G#4","A#4","B#4","C##5"],terms:['constant_structure','symmetric_division'],why:{ko:'장3도로 나누면 3등분(3개 근음), 단3도로 나누면 4등분(4개 근음), 온음으로 나누면 옥타브를 정확히 6등분합니다 — 이 여섯 근음이 바로 온음음계 자체예요.',en:'Dividing by major 3rds gives 3 equal parts, by minor 3rds gives 4, and by whole tones gives exactly 6 equal parts -- these six roots are the whole-tone scale itself.'}});
  /* -- CH 50: Cadence Types -- Authentic, Plagal, Half, Deceptive -- */
  [
    {key:'C',ii7:'Dm7',v:'G7',target:'Cmaj7',ans:'정격 종지(authentic cadence)',opts:['정격 종지(authentic cadence)','변격 종지(plagal cadence)','반종지(half cadence)','위장 종지(deceptive cadence)'],
     whyKo:'V7가 완전5도 아래 I로 곧장 해결되면 정격 종지입니다 — 가장 강하고 확실하게 "끝났다"는 느낌을 주는 종지예요.',
     whyEn:'When V7 resolves down a perfect 5th directly to I, that\'s an authentic cadence -- the strongest, most conclusive-sounding way to end.'},
    {key:'C',ii7:'Fmaj7',v:'Fmaj7',target:'Cmaj7',ans:'변격 종지(plagal cadence)',opts:['정격 종지(authentic cadence)','변격 종지(plagal cadence)','반종지(half cadence)','위장 종지(deceptive cadence)'],
     whyKo:'IV에서 I로 가는 종지는 변격 종지입니다. "아멘 종지"라고도 불리며, 정격 종지보다 부드럽고 차분한 느낌을 줍니다.',
     whyEn:'A cadence moving from IV to I is a plagal cadence -- often called the "Amen cadence," it feels gentler and calmer than an authentic cadence.'},
    {key:'C',ii7:'Dm7',v:'G7',target:'G7',ans:'반종지(half cadence)',opts:['정격 종지(authentic cadence)','변격 종지(plagal cadence)','반종지(half cadence)','위장 종지(deceptive cadence)'],
     whyKo:'V(딸림화음)에서 멈추는 종지는 반종지입니다. 완전히 끝난 게 아니라 "쉼표"처럼 들려서, 다음 구절을 계속 이어가고 싶게 만듭니다.',
     whyEn:'A cadence that stops on V is a half cadence -- it sounds like a comma rather than a full stop, making the ear want the phrase to continue.'},
    {key:'C',ii7:'Dm7',v:'G7',target:'Am7',ans:'위장 종지(deceptive cadence)',opts:['정격 종지(authentic cadence)','변격 종지(plagal cadence)','반종지(half cadence)','위장 종지(deceptive cadence)'],
     whyKo:'V7가 예상되는 I 대신 다른 화음(대개 vi)으로 가면 위장 종지입니다. 끝날 것 같다가 예상을 깨서 곡을 이어가게 만드는 효과가 있어요.',
     whyEn:'When V7 resolves to a different chord (usually vi) instead of the expected I, that\'s a deceptive cadence -- it subverts the expected ending to keep the music moving.'},
  ].forEach(({key,ii7,v,target,ans,opts,whyKo,whyEn})=>{
    function spellFromSym(sym){
      const m=sym.match(/^([A-G][#b]?)(maj7|m7b5|m7|7)$/);
      const root=m[1],qual=m[2];
      const pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[root[0]]+(root[1]==='#'?1:root[1]==='b'?-1:0);
      const CHS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
      const CHF=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
      const flats=root.includes('b');
      const third=qual==='maj7'||qual==='7'?4:3, fifth=qual==='m7b5'?6:7, seventh=qual==='maj7'?11:10;
      return [0,third,fifth,seventh].map(off=>{
        const rawPc=((pc+off)%12+12)%12;
        const nm=(flats?CHF:CHS)[rawPc];
        const oct=(off>0&&rawPc<((pc%12+12)%12))?5:4;
        return nm+oct;
      });
    }
    const vChord=spellFromSym(v);
    const targetChord=spellFromSym(target);
    const termFor=ans.includes('정격')?'authentic_cadence':ans.includes('변격')?'plagal_cadence':ans.includes('반종지')?'half_cadence':'deceptive_cadence';
    add({ch:50,type:'mc',q:{ko:`${key} 장조에서 ${ii7} → ${v} → ${target} 진행입니다. 이 종지는 어떤 종류인가요?`,en:`In ${key} major: ${ii7} -> ${v} -> ${target}. What type of cadence is this?`},
      staff:drawStaff({cl:'treble',ns:targetChord.map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:140+i*4})),w:280}),
      audio:[...vChord,...targetChord],ans,opts,terms:[termFor],
      why:{ko:whyKo,en:whyEn}});
  });

  /* -- CH 51: Contiguous Dominants Deep Dive (Harmony 4) -- */
  add({ch:51,type:'mc',q:{ko:'C 장조 곡에서 G7 → A♭7 → A7 → B♭7로 반음씩 계속 올라갑니다. 이 진행이 최종적으로 어느 조성으로의 전이적 전조를 만들어내나요?',en:'In a C major tune: G7 -> Ab7 -> A7 -> Bb7, climbing by half steps. Which key does this progression ultimately create a transitional modulation into?'},staff:drawStaff({cl:'treble',ns:[{"note":"G4","acc":"","color":"#1a1a1a","style":"whole","x":100},{"note":"B4","acc":"","color":"#1a1a1a","style":"whole","x":110},{"note":"D5","acc":"","color":"#1a1a1a","style":"whole","x":120},{"note":"F5","acc":"","color":"#1a1a1a","style":"whole","x":130},{"note":"Ab4","acc":"","color":"#7a3b52","style":"whole","x":140},{"note":"C5","acc":"","color":"#7a3b52","style":"whole","x":150},{"note":"Eb5","acc":"","color":"#7a3b52","style":"whole","x":160},{"note":"Gb5","acc":"","color":"#7a3b52","style":"whole","x":170},{"note":"A4","acc":"","color":"#20406b","style":"whole","x":180},{"note":"C#5","acc":"","color":"#20406b","style":"whole","x":190},{"note":"E5","acc":"","color":"#20406b","style":"whole","x":200},{"note":"G5","acc":"","color":"#20406b","style":"whole","x":210},{"note":"Bb4","acc":"","color":"#8a6a54","style":"whole","x":220},{"note":"D5","acc":"","color":"#8a6a54","style":"whole","x":230},{"note":"F5","acc":"","color":"#8a6a54","style":"whole","x":240},{"note":"Ab5","acc":"","color":"#8a6a54","style":"whole","x":250}],w:300}),audio:["G4","B4","D5","F5","Ab4","C5","Eb5","Gb5","A4","C#5","E5","G5","Bb4","D5","F5","Ab5"],ans:'♭III (Eb)',opts:['♭III (Eb)','IV (F)','V (G)','원조 그대로 (C)'],terms:['contiguous_dominant'],why:{ko:'반음씩 3번 올라가 G7에서 B♭7까지 도달합니다. B♭7는 E♭(C 장조의 ♭III) 위의 완전5도 도미넌트라, 이 사슬은 결국 ♭III 조성으로의 전이적 전조를 만들어냅니다. 처음엔 해결을 노린 게 아니었는데, 새 조성에 도착하고 보니 그렇게 된 거예요.',en:'Climbing three half steps from G7 reaches Bb7. Bb7 sits a perfect 5th above Eb (C major\'s bIII), so this chain ends up creating a transitional modulation into bIII -- it never aimed for a resolution, yet arrived to find a new key waiting.'}});
  add({ch:51,type:'mc',q:{ko:'C7에서 시작하는 이 도미넌트 사슬의 근음 이동 패턴은?',en:'What is the root-motion pattern of this dominant chain starting on C7?'},staff:drawStaff({cl:'treble',ns:[{"note":"C4","acc":"","color":"#1a1a1a","style":"whole","x":100},{"note":"E4","acc":"","color":"#1a1a1a","style":"whole","x":110},{"note":"G4","acc":"","color":"#1a1a1a","style":"whole","x":120},{"note":"Bb4","acc":"","color":"#1a1a1a","style":"whole","x":130},{"note":"C#4","acc":"","color":"#7a3b52","style":"whole","x":140},{"note":"E#4","acc":"","color":"#7a3b52","style":"whole","x":150},{"note":"G#4","acc":"","color":"#7a3b52","style":"whole","x":160},{"note":"B4","acc":"","color":"#7a3b52","style":"whole","x":170},{"note":"C##4","acc":"","color":"#20406b","style":"whole","x":180},{"note":"E##4","acc":"","color":"#20406b","style":"whole","x":190},{"note":"G##4","acc":"","color":"#20406b","style":"whole","x":200},{"note":"B#4","acc":"","color":"#20406b","style":"whole","x":210}],w:260}),audio:["C4","E4","G4","Bb4","C#4","E#4","G#4","B4","C##4","E##4","G##4","B#4"],ans:'반음씩 상행',opts:["온음씩 상행","반음씩 상행","단3도씩 상행"],terms:['contiguous_dominant'],why:{ko:'연속 도미넌트는 해결이나 기능 분석에 얽매이지 않고 나란히 옆으로 이동합니다. 근음이 반음씩 상행 이동하는 것 자체가 진행을 이끄는 유일한 원리예요.',en:'Contiguous dominants move side by side without being grounded in resolution or functional analysis. The root moving up in half steps is the only principle driving the progression.'}});
  add({ch:51,type:'mc',q:{ko:'D7에서 시작하는 이 도미넌트 사슬의 근음 이동 패턴은?',en:'What is the root-motion pattern of this dominant chain starting on D7?'},staff:drawStaff({cl:'treble',ns:[{"note":"D4","acc":"","color":"#1a1a1a","style":"whole","x":100},{"note":"F#4","acc":"","color":"#1a1a1a","style":"whole","x":110},{"note":"A4","acc":"","color":"#1a1a1a","style":"whole","x":120},{"note":"C5","acc":"","color":"#1a1a1a","style":"whole","x":130},{"note":"E4","acc":"","color":"#7a3b52","style":"whole","x":140},{"note":"G#4","acc":"","color":"#7a3b52","style":"whole","x":150},{"note":"B4","acc":"","color":"#7a3b52","style":"whole","x":160},{"note":"D5","acc":"","color":"#7a3b52","style":"whole","x":170},{"note":"F#4","acc":"","color":"#20406b","style":"whole","x":180},{"note":"A#4","acc":"","color":"#20406b","style":"whole","x":190},{"note":"C#5","acc":"","color":"#20406b","style":"whole","x":200},{"note":"E5","acc":"","color":"#20406b","style":"whole","x":210}],w:260}),audio:["D4","F#4","A4","C5","E4","G#4","B4","D5","F#4","A#4","C#5","E5"],ans:'온음씩 상행',opts:["반음씩 상행","단3도씩 상행","온음씩 상행"],terms:['contiguous_dominant'],why:{ko:'연속 도미넌트는 해결이나 기능 분석에 얽매이지 않고 나란히 옆으로 이동합니다. 근음이 온음씩 상행 이동하는 것 자체가 진행을 이끄는 유일한 원리예요.',en:'Contiguous dominants move side by side without being grounded in resolution or functional analysis. The root moving up in whole steps is the only principle driving the progression.'}});
  add({ch:51,type:'mc',q:{ko:'F7에서 시작하는 이 도미넌트 사슬의 근음 이동 패턴은?',en:'What is the root-motion pattern of this dominant chain starting on F7?'},staff:drawStaff({cl:'treble',ns:[{"note":"F4","acc":"","color":"#1a1a1a","style":"whole","x":100},{"note":"A4","acc":"","color":"#1a1a1a","style":"whole","x":110},{"note":"C5","acc":"","color":"#1a1a1a","style":"whole","x":120},{"note":"Eb5","acc":"","color":"#1a1a1a","style":"whole","x":130},{"note":"Ab4","acc":"","color":"#7a3b52","style":"whole","x":140},{"note":"C5","acc":"","color":"#7a3b52","style":"whole","x":150},{"note":"Eb5","acc":"","color":"#7a3b52","style":"whole","x":160},{"note":"Gb5","acc":"","color":"#7a3b52","style":"whole","x":170},{"note":"Cb5","acc":"","color":"#20406b","style":"whole","x":180},{"note":"Eb5","acc":"","color":"#20406b","style":"whole","x":190},{"note":"Gb5","acc":"","color":"#20406b","style":"whole","x":200},{"note":"Bbb5","acc":"","color":"#20406b","style":"whole","x":210}],w:260}),audio:["F4","A4","C5","Eb5","Ab4","C5","Eb5","Gb5","Cb5","Eb5","Gb5","Bbb5"],ans:'단3도씩 상행',opts:["반음씩 상행","온음씩 상행","단3도씩 상행"],terms:['contiguous_dominant'],why:{ko:'연속 도미넌트는 해결이나 기능 분석에 얽매이지 않고 나란히 옆으로 이동합니다. 근음이 단3도씩 상행 이동하는 것 자체가 진행을 이끄는 유일한 원리예요.',en:'Contiguous dominants move side by side without being grounded in resolution or functional analysis. The root moving up in minor 3rds is the only principle driving the progression.'}});
  add({ch:51,type:'mc',q:{ko:'G7에서 시작하는 이 도미넌트 사슬의 근음 이동 패턴은?',en:'What is the root-motion pattern of this dominant chain starting on G7?'},staff:drawStaff({cl:'treble',ns:[{"note":"G4","acc":"","color":"#1a1a1a","style":"whole","x":100},{"note":"B4","acc":"","color":"#1a1a1a","style":"whole","x":110},{"note":"D5","acc":"","color":"#1a1a1a","style":"whole","x":120},{"note":"F5","acc":"","color":"#1a1a1a","style":"whole","x":130},{"note":"G#4","acc":"","color":"#7a3b52","style":"whole","x":140},{"note":"B#4","acc":"","color":"#7a3b52","style":"whole","x":150},{"note":"D#5","acc":"","color":"#7a3b52","style":"whole","x":160},{"note":"F#5","acc":"","color":"#7a3b52","style":"whole","x":170},{"note":"G##4","acc":"","color":"#20406b","style":"whole","x":180},{"note":"B##4","acc":"","color":"#20406b","style":"whole","x":190},{"note":"D##5","acc":"","color":"#20406b","style":"whole","x":200},{"note":"F##5","acc":"","color":"#20406b","style":"whole","x":210}],w:260}),audio:["G4","B4","D5","F5","G#4","B#4","D#5","F#5","G##4","B##4","D##5","F##5"],ans:'반음씩 상행',opts:["온음씩 상행","반음씩 상행","단3도씩 상행"],terms:['contiguous_dominant'],why:{ko:'연속 도미넌트는 해결이나 기능 분석에 얽매이지 않고 나란히 옆으로 이동합니다. 근음이 반음씩 상행 이동하는 것 자체가 진행을 이끄는 유일한 원리예요.',en:'Contiguous dominants move side by side without being grounded in resolution or functional analysis. The root moving up in half steps is the only principle driving the progression.'}});
  add({ch:51,type:'mc',q:{ko:'연속 도미넌트에 관련 II−7를 붙일 때, 도미넌트와 II−7 각각의 코드 스케일은?',en:'When a related II-7 is attached to each contiguous dominant, what chord scale does each chord take?'},audio:[],ans:'도미넌트=믹소리디안, II−7=도리안',opts:['도미넌트=믹소리디안, II−7=도리안','도미넌트=리디안♭7, II−7=로크리안','둘 다 믹소리디안','둘 다 얼터드'],terms:['contiguous_dominant','related_ii7'],why:{ko:'도미넌트는 믹소리디안, 그 앞에 붙는 관련 II−7는 도리안을 씁니다. 도미넌트 자체가 조성 밖의 음이라, 그 II−7도 자연스럽게 조성 밖의 도리안 스케일을 갖게 되는 거예요.',en:'The dominant takes Mixolydian, and its related II-7 in front takes Dorian. Since the dominant itself is nondiatonic, its related II-7 naturally carries a nondiatonic Dorian scale too.'}});
  add({ch:51,type:'mc',q:{ko:'연속 도미넌트를 쓰는 다섯 가지 목적 중, "확장 도미넌트"와 대비되는 특징은?',en:'Among the five purposes of contiguous dominants, what distinguishes them from extended dominants?'},audio:[],ans:'확장 도미넌트는 5도씩 하행하며 결국 도착하지만, 연속 도미넌트는 다른 방향(주로 상행)으로 움직이며 끝내 해결되지 않을 수도 있다',opts:['확장 도미넌트는 5도씩 하행하며 결국 도착하지만, 연속 도미넌트는 다른 방향(주로 상행)으로 움직이며 끝내 해결되지 않을 수도 있다','둘은 완전히 같은 것이다','연속 도미넌트만 재즈에 쓰인다','확장 도미넌트는 반음계적이다'],terms:['contiguous_dominant','extended_dominant'],why:{ko:'확장 도미넌트가 "결국 도착하는 하행 사슬"이라면, 연속 도미넌트는 "옆으로 걷는 사슬"입니다. 방향도 다르고, 목적지가 아예 없을 수도 있어요.',en:'If an extended dominant is a descending chain that eventually arrives, a contiguous dominant is a chain walking sideways -- different direction, and it may never resolve at all.'}});

const CHAPTER_TERM_MAP={
  0:['treble_clef','bass_clef'],1:['accidental','enharmonic'],2:['major_scale','scale_degree'],
  3:['natural_minor','harmonic_minor'],4:['pentatonic_scale'],5:['key_signature','cycle_of_fifths'],

  9:['chord_inversion','slash_chord'],10:['mode'],11:['tendency_tone','avoid_note'],
  12:['roman_numerals','cadence'],13:['secondary_dominant','related_ii7'],14:['modal_interchange','borrowed_chord','blue_note'],
};
ALL.forEach(p=>{ if(!p.terms && CHAPTER_TERM_MAP[p.ch]) p.terms=CHAPTER_TERM_MAP[p.ch]; });

// CH10 override: tag each mode-writing/identification question with its OWN specific mode term
// (rather than the generic 'mode' fallback), by reading the mode name out of the question text.
const MODE_TERM_MATCH=[
  [/ionian|아이오니안/i,'ionian'],[/dorian|도리안/i,'dorian'],[/phryg|프리지안/i,'phrygian'],
  [/lydian|리디안/i,'lydian'],[/mixo|믹소/i,'mixolydian'],[/aeolian|에올리안/i,'aeolian'],[/locrian|로크리안/i,'locrian'],
];
ALL.filter(p=>p.ch===10).forEach(p=>{
  const text=(p.q.ko||'')+' '+(p.q.en||'')+' '+(p.ans||'');
  for(const [re,term] of MODE_TERM_MATCH){
    if(re.test(text)){ p.terms=[term,'mode']; break; }
  }
});

/* ═══════════════════════════════════════════════
   RETROFIT: friendly "why" explanations for Ch.0-14 (original content)
   Generated from each problem's own data — not hand-authored per item.
═══════════════════════════════════════════════ */
function whyFor(p){
  const noteLetter=n=>n.replace(/[\d#b]+$/,'').replace(/\d+$/,'').match(/^[A-G][#b]{0,2}/)[0];
  if(p.ch===0){
    const n=p.ans;
    return {ko:`이 음은 ${n}입니다. 알파벳은 A-G까지 반복되니, 가온 도(C4)를 기준 삼아 위/아래로 몇 칸(도수)인지 세어보면 빠르게 읽을 수 있어요.`,
            en:`This note is ${n}. Letter names cycle A-G, so counting lines/spaces up or down from middle C (C4) is the fastest way to read it.`};
  }
  if(p.ch===1){
    const n=p.ans;
    return {ko:`이명동음(enharmonic)은 실제 소리(피아노 건반)는 완전히 같지만 표기만 다른 음입니다. ${n}도 마찬가지로, 어느 조성·문맥에서 더 자연스럽게 읽히는지에 따라 표기를 고릅니다.`,
            en:`Enharmonic notes sound identical (same piano key) but are spelled differently. ${n} is the same pitch spelled to fit whatever key or context reads more naturally.`};
  }
  if(p.ch===2){
    const key=(p.q.ko.match(/^(\S+) maj/)||[])[1]||'';
    return {ko:`장음계는 온음-온음-반음-온음-온음-온음-반음(W-W-H-W-W-W-H) 순서로 쌓입니다. ${key} 장음계도 이 패턴을 따라가면 틀리지 않고 쓸 수 있어요.`,
            en:`A major scale always follows Whole-Whole-Half-Whole-Whole-Whole-Half. Applying that same pattern to ${key} gives you the correct notes every time.`};
  }
  if(p.ch===3){
    const key=(p.q.ko.match(/^(\S+) /)||[])[1]||'';
    const kind=p.q.ko.includes('화성')?'화성단조(harmonic minor, 7음을 반음 올림)':p.q.ko.includes('선율')?'선율단조(melodic minor, 올라갈 때 6·7음을 반음 올림)':'자연단조(natural minor, 장음계의 6번째 음부터 시작한 것과 같은 음)';
    return {ko:`${kind}입니다. 어떤 장음계의 관계단조(relative minor)인지 먼저 떠올리면 음을 훨씬 쉽게 채울 수 있어요.`,
            en:`This is the ${kind.split('(')[0].trim()}. Thinking of which major scale it's the relative minor of makes filling in the notes much easier.`};
  }
  if(p.ch===4){
    const isMaj=p.q.ko.includes('maj pent');
    return {ko:isMaj?'장5음음계는 장음계에서 4번째·7번째 음(반음 관계를 만드는 음)을 뺀 5개 음으로 이뤄집니다.':'단5음음계는 자연단조에서 2번째·6번째 음을 뺀 5개 음으로 이뤄집니다.',
            en:isMaj?'A major pentatonic removes the 4th and 7th scale degrees (the ones that create half steps) from the major scale, leaving 5 notes.':'A minor pentatonic removes the 2nd and 6th scale degrees from the natural minor scale, leaving 5 notes.'};
  }
  if(p.ch===5){
    return {ko:`조표에 있는 샵/플랫의 개수와 순서(샵: F-C-G-D-A-E-B, 플랫: B-E-A-D-G-C-F)를 알면, 5도권(circle of fifths) 위에서 어느 조인지 바로 찾을 수 있어요.`,
            en:`Knowing the sharp order (F-C-G-D-A-E-B) or flat order (B-E-A-D-G-C-F) in a key signature lets you locate the key directly on the circle of fifths.`};
  }
  if(p.ch===6){
    const notes=p.audio||[];
    return {ko:`${notes.join('-')} 두 음 사이의 음정입니다. 먼저 알파벳 letter 개수(도수: 2도·3도...)를 세고, 그다음 실제 반음 개수로 장/단/완전 여부를 확인하면 정확합니다.`,
            en:`This is the interval between ${notes.join(' and ')}. First count the letter-name distance (the numeral), then check the semitone count to confirm major/minor/perfect quality.`};
  }
  if(p.ch===7){
    const ans=p.ans;
    return {ko:`${ans} 화음입니다. 근음에서 3음까지의 음정(장3도면 장/증 계열, 단3도면 단/감 계열)과 3음에서 5음까지의 음정을 함께 보면 장/단/증/감을 구별할 수 있어요.`,
            en:`This is ${ans}. Look at the interval from root to 3rd (major 3rd → major/augmented family, minor 3rd → minor/diminished family) together with 3rd-to-5th to tell the quality apart.`};
  }
  if(p.ch===8){
    const ans=p.ans;
    return {ko:`${ans}입니다. 아래에 깔린 3화음의 종류(장/단/감)에 7음이 장7도로 얹혔는지, 단7도로 얹혔는지를 보면 5가지 7화음 종류를 구별할 수 있어요.`,
            en:`This is ${ans}. Identify the triad underneath (major/minor/diminished) and whether the 7th is major or minor above the root — that combination distinguishes the five 7th-chord types.`};
  }
  if(p.ch===9){
    const ans=p.ans;
    return {ko:`${ans}입니다. 자리바꿈은 가장 낮은 음(베이스)이 근음이 아니라 3음·5음·7음일 때를 말합니다 — 베이스에 어떤 화음음이 왔는지만 확인하면 됩니다.`,
            en:`This is ${ans}. An inversion is simply when the lowest note (the bass) is the 3rd, 5th, or 7th instead of the root — just check which chord tone sits on the bottom.`};
  }
  if(p.ch===10){
    const mode=(p.q.ko.match(/^(\S+ \S+)/)||[])[1]||'';
    return {ko:`${mode}는 같은 흰 건반들을 다른 음에서 시작한 것뿐이라, 그 근원이 되는 장음계(관련 아이오니안)를 알면 조표 그대로 옮겨 쓸 수 있어요.`,
            en:`${mode} uses the exact same notes as a major scale, just starting on a different degree — once you know its parent (relative Ionian) major scale, you can reuse its key signature directly.`};
  }
  if(p.ch===11){
    return {ko:`안정음(트라이어드 구성음: 으뜸음·3음·5음)은 그 자체로 편안하게 들리고, 나머지 음(경과음·긴장음)은 안정음 쪽으로 해결되려는 성향을 가집니다.`,
            en:`The stable tones (the tonic triad — root, 3rd, 5th) sound settled on their own, while the remaining scale tones carry a tendency to resolve toward one of them.`};
  }
  if(p.ch===12){
    const rn=p.ans;
    return {ko:`${rn}입니다. 장조를 다이아토닉하게 3도씩 쌓으면 순서대로 Imaj7-IIm7-IIIm7-IVmaj7-V7-VIm7-VIIm7(b5)가 되는데, 이 순서만 외워두면 어느 화음이든 로마숫자를 바로 알 수 있어요.`,
            en:`This is ${rn}. Stacking the major scale diatonically in 3rds always gives Imaj7-IIm7-IIIm7-IVmaj7-V7-VIm7-VIIm7(b5), in that fixed order — memorize that sequence and any diatonic chord's Roman numeral follows immediately.`};
  }
  if(p.ch===13){
    return {ko:`부속화음(secondary dominant)은 원래 조성에 없는 임시표를 빌려와서, 목표 화음의 '진짜 도미넌트'처럼 완전5도 위(또는 반음 아래)로 해결되도록 만든 화음입니다.`,
            en:`A secondary dominant borrows an accidental from outside the key so it can resolve like a real dominant — down a perfect 5th — into its own temporary target chord.`};
  }
  if(p.ch===14){
    return {ko:`모달 인터체인지는 같은 으뜸음을 가진 다른 선법(주로 평행단조 계열)에서 화음을 잠깐 빌려와 색채를 더하는 기법입니다. 장조 안에서 잠깐 단조스러운 화음이 들리면 대부분 이 경우예요.`,
            en:`Modal interchange borrows a chord from a different mode sharing the same tonic (usually the parallel minor family) for color. When a major-key passage briefly sounds minor, this is almost always why.`};
  }
  return null;
}
ALL.forEach(p=>{ if(p.why===undefined && p.ch>=0 && p.ch<=14){ const w=whyFor(p); if(w)p.why=w; } });

    .filter(id=>TERM_MAP[id]).map(id=>{

let LG='ko',CH=0;
const DONE={};
let XP=0,STREAK=0,BEST=0;

function gps(ch){return ALL.filter(p=>p.ch===ch);}

function rSB(){
  let tot=0,dn=0;
  ALL.forEach(p=>{tot++;if(DONE[p.id])dn++;});
  document.getElementById('pgtx')&&(document.getElementById('pgtx').textContent=`${dn}/${tot}`);
  const pct=tot?Math.round(dn/tot*100):0;
  const pbar=document.getElementById('pbar');if(pbar)pbar.style.width=pct+'%';
  document.getElementById('xpv').textContent=XP;
  document.getElementById('streakv').textContent=STREAK;
  const list=document.getElementById('chl');
  let lastGrp=null,html='';
  CHS.forEach((c,i)=>{
    if(c.grp!==lastGrp){
      const label=c.grp==='h4'?(LG==='ko'?'하모니 4':'Harmony 4'):c.grp==='h3'?(LG==='ko'?'하모니 3':'Harmony 3'):(LG==='ko'?'하모니 1 & 2':'Harmony 1 & 2');
      html+=`<div class="sbgrp ${c.grp!=='h12'?c.grp:''}">${label}</div>`;
      lastGrp=c.grp;
    }
    const ps=gps(i),done=ps.filter(p=>DONE[p.id]).length;
    const ttl=LG==='ko'?c.t.split('/')[0]:c.t.split('/')[1]||c.t;
    const full=done===ps.length&&ps.length>0;
    html+=`<button class="cbtn${i===CH?' act '+(c.grp==='h3'?'h3':''):''}"onclick="A.gc(${i})">${ttl}${full?' <span class="badge100">🏅</span>':''}<span class="pg">${LG==='ko'?c.d:c.de}</span><span class="cp">${done}/${ps.length}</span></button>`;
  });
  list.innerHTML=html;
}

function rProbs(){
  const c=CHS[CH],ps=gps(CH);
  document.getElementById('cht').textContent=LG==='ko'?c.t.split('/')[0]:c.t.split('/')[1]||c.t;
  document.getElementById('chd').textContent=LG==='ko'?c.d:c.de;
  const chdr=document.getElementById('chdr');
  chdr.className='chdr'+(c.grp==='h3'?' h3':c.grp==='h4'?' h4':'');
  const done=ps.filter(p=>DONE[p.id]).length;
  document.getElementById('pct').textContent=`${done}/${ps.length} ${LG==='ko'?'완료':'done'}`;
  // chapter-level quick links: pick most common terms among this chapter's problems
  const termSet=new Set();ps.forEach(p=>(p.terms||[]).forEach(t=>termSet.add(t)));
  document.getElementById('chlinks').innerHTML=termChips([...termSet].slice(0,3));
  if(!ps.length){document.getElementById('pbs').innerHTML='<div class="pb" style="color:var(--mut)">문제 없음</div>';return;}
  document.getElementById('pbs').innerHTML=ps.map(p=>rOne(p)).join('');
  const wps=ps.filter(p=>p.type==='write');
  wps.forEach(p=>{
    const cl=p.clef||'treble';
    if(!ST[p.id])ST[p.id]={pl:[],sa:'',cl};
    initIS(p.id,cl,p.given||[],p.givenX||80);
  });
  const sps=ps.filter(p=>p.type==='select');
  sps.forEach(p=>{
    const cl=p.clef||'treble';
    initSL(p.id,p.ns||[],cl);
  });
  const ap=[...wps,...sps];
  if(ap.length){setTimeout(()=>setActive(ap[0].id),80);}
  if(window.innerWidth<=820){document.getElementById('sb').classList.remove('open');document.getElementById('sbovl').classList.remove('open');}
}

function rOne(p){
  const q=p.q||{};
  const qh=`<div class="pq"><span class="ko">${q.ko||''}</span><span class="en">${q.en||''}</span></div>`;
  const num=`<div class="pnum">${p.id} · ch${p.ch+1}</div>`;
  const playBtn=(p.audio&&p.audio.length)?`<button class="btn bpl"onclick="A.pp('${p.id}')">▶ 듣기</button>`:'';
  let body='';
  if(p.type==='id')body=rID(p);
  else if(p.type==='mc')body=rMC(p);
  else if(p.type==='write')body=rWR(p);
  else if(p.type==='select')body=rSL(p);
  else if(p.type==='analyze')body=rAZ(p);
  const chips=p.terms?`<div class="links">${termChips(p.terms)}</div>`:'';
  const whyBox=(p.why&&DONE[p.id])?`<div class="why" id="why_${p.id}">💡 ${LG==='ko'?p.why.ko:p.why.en}</div>`:`<div class="why" id="why_${p.id}" style="display:none">💡 ${p.why?(LG==='ko'?p.why.ko:p.why.en):''}</div>`;
  return `<div class="pb${DONE[p.id]?' solved':''}"id="pb_${p.id}">${num}${qh}${body}<div class="ar">${playBtn}</div>${chips}<div class="fb"id="fb_${p.id}"></div>${p.why?whyBox:''}</div>`;
}

function rID(p){
  const sf=p.staff?`<div class="sw">${p.staff}</div>`:'';
  return sf+`<div class="ar"style="margin-top:8px">
    <input class="ai"id="ai_${p.id}"placeholder="${LG==='ko'?'답 입력...':'Answer...'}"onkeydown="if(event.key==='Enter')A.ck('${p.id}')"/>
    <button class="btn bp"onclick="A.ck('${p.id}')">확인</button>
    <button class="btn bs"onclick="A.sh('${p.id}')">힌트</button>
  </div>`;
}
function rMC(p){
  const sf=p.staff?`<div class="sw">${p.staff}</div>`:'';
  const opts=(p.opts||[]).map(o=>`<button class="mo"onclick="A.cm('${p.id}','${o.replace(/'/g,"\\'").replace(/"/g,'&quot;')}',this)">${o}</button>`).join('');
  return sf+`<div class="mco">${opts}</div>`;
}
function rWR(p){
  const cl=p.clef||'treble',giv=p.given||[],gx=p.givenX||80;
  if(!ST[p.id])ST[p.id]={pl:[],sa:'',cl};
  const s=ST[p.id];
  const gNs=giv.map((n,i)=>({note:n,acc:'',color:'#1a1a1a',style:'whole',x:gx+i*40}));
  const svg=drawStaff({cl,ns:[...gNs,...s.pl],w:600,inter:true,id:'is_'+p.id});
  const ab=['','#','b','##','bb','n'].map(a=>`<button class="ab${s.sa===a?' sl':''}"onclick="A.sa('${p.id}','${a}')"title="${a||'♮'}">${ACC[a]||'♮'}</button>`).join('');
  const ph=LG==='ko'?'음표명 띄어쓰기로 입력이로... (C4 D4 E4)':'note names space-separated (C4 D4 E4)';
  const lbni=LG==='ko'?'✏️ 직접 입력':'✏️ Type notes';
  const lbset=LG==='ko'?'오선에 입력':'Set on staff';
  const micLbl=LG==='ko'?'🎤 노래·연주로 입력:':'🎤 Sing/play to enter:';
  return `<div class="sw">${svg}</div>
    <div class="abar"><span class="ahl">${LG==='ko'?'임시표:':'Acc:'}</span>${ab}
    <button class="btn bc"style="margin-left:6px"onclick="A.cl('${p.id}')">지우기</button>
    <button class="btn bp"onclick="A.cw('${p.id}')">확인/Check</button></div>
    <div class="abar"style="margin-top:4px;gap:6px">
      <span class="ahl">${lbni}:</span>
      <input class="nti"id="ni_${p.id}"placeholder="${ph}"onkeydown="if(event.key==='Enter'){A.nt('${p.id}');event.preventDefault();}"/>
      <button class="btn bs"onclick="A.nt('${p.id}')">${lbset}</button>
    </div>
    <div class="abar"style="margin-top:4px;gap:6px">
      <span class="ahl">${micLbl}</span>
      <button class="btn bs"id="micbtn_${p.id}"onclick="A.micToggle('${p.id}')">🎤 ${LG==='ko'?'듣기 시작':'Start listening'}</button>
      <span class="ahl"id="micstat_${p.id}"></span>
    </div>`;
}
function rSL(p){
  const ns=p.ns||[];const cl=p.clef||'treble';
  if(!ST[p.id])ST[p.id]={sel:new Set(),cl,ns};
  const s=ST[p.id];
  const sp=40,sx=78,w=Math.max(520,sx+ns.length*sp+60);
  const no=ns.map((n,i)=>({note:n,acc:'',color:s.sel.has(i)?'#16a34a':'#1a1a1a',style:'whole',x:sx+i*sp}));
  const svg=drawStaff({cl,ns:no,w,inter:true,id:'sl_'+p.id});
  const hint=LG==='ko'?'음표를 클릭하거나 건반으로 선택 (초록=선택됨)':'Click notes or use keyboard (green=selected)';
  return `<div class="sw">${svg}</div>`
    +`<div class="abar" style="margin-top:4px;gap:6px">`
    +`<span class="ahl">${hint}</span>`
    +`<button class="btn bc" onclick="A.clsl('${p.id}')">지우기</button>`
    +`<button class="btn bp" onclick="A.csl('${p.id}')">확인/Check</button>`
    +`</div>`;
}
function rAZ(p){
  const sf=p.staff?`<div class="sw">${p.staff}</div>`:'';
  if(p.opts&&p.opts.length){
    const opts=p.opts.map(o=>`<button class="mo"onclick="A.cm('${p.id}','${o.replace(/'/g,"\\'")}',this)">${o}</button>`).join('');
    return sf+`<div class="mco">${opts}</div>`;
  }
  return sf+`<div class="ar"style="margin-top:8px">
    <input class="ai"id="ai_${p.id}"placeholder="${LG==='ko'?'답 입력...':'Answer...'}"onkeydown="if(event.key==='Enter')A.ck('${p.id}')"/>
    <button class="btn bp"onclick="A.ck('${p.id}')">확인</button>
    <button class="btn bs"onclick="A.sh('${p.id}')">정답 보기</button>
  </div>`;
}

const A={
  init(){mkPiano();this.lp();rSB();rProbs();},
  gc(i){micStop();CH=i;rSB();rProbs();window.scrollTo(0,0);},
  prev(){if(CH>0){micStop();CH--;rSB();rProbs();window.scrollTo(0,0);}},
  next(){if(CH<CHS.length-1){micStop();CH++;rSB();rProbs();window.scrollTo(0,0);}},
  lang(){LG=LG==='ko'?'en':'ko';rSB();rProbs();},
  toggleSB(){
    const sb=document.getElementById('sb'),ov=document.getElementById('sbovl');
    sb.classList.toggle('open');ov.classList.toggle('open');
  },
  pk(note){
    pnote(freq(note));
    const m=midi(note);
    if(m){const el=document.querySelector(`[data-m="${m}"]`);if(el){el.classList.add('pk');setTimeout(()=>el.classList.remove('pk'),460);}}
    if(APID&&ST[APID]){
      const s=ST[APID];const p=ALL.find(x=>x.id===APID);if(!p)return;
      if(p.type==='select'){
        const ns=p.ns||s.ns||[];
        const em=midi(note);
        const ci=ns.findIndex(n=>midi(n)===em);
        if(ci>=0){if(s.sel.has(ci))s.sel.delete(ci);else s.sel.add(ci);
          reSL(APID,ns,s.cl||'treble');}
        return;
      }
      const cl=s.cl||'treble';
      const em=midi(note);
      const ei=s.pl.findIndex(n=>{
        const full=n.note.slice(0,-1)+(n.acc||'')+n.note.slice(-1);
        return midi(full)===em;
      });
      if(ei>=0){s.pl.splice(ei,1);}
      else{
        const gx=(p.givenX||80),gc=(p.given||[]).length;
        const nx=gx+gc*40+s.pl.length*40;
        s.pl.push({note,acc:'',x:nx,color:'#2563eb',style:'whole'});
      }
      reIS(APID,cl,p.given||[],p.givenX||80);
    }
  },
  pp(pid){
    const p=ALL.find(x=>x.id===pid);if(!p||!p.audio)return;
    if(p.type==='write'&&ST[pid]){
      const placed=ST[pid].pl.map(n=>{const full=n.note.slice(0,-1)+(n.acc||'')+n.note.slice(-1);return full;});
      const all=[...(p.given||[]),...placed];
      if(p.given&&p.given.length){pnote(freq(p.given[0]),0,.7);setTimeout(()=>{play(all);flash(all);},500);}
      else{play(all);flash(all);}
    }else if((p.ch===7||p.ch===8||p.ch===9)&&p.type==='mc'&&p.audio.length>1){
      pnote(freq(p.audio[0]),0,.7);
      setTimeout(()=>{playchord(p.audio);flash(p.audio);},600);
    }else if(p.ch===28&&p.type==='mc'&&p.audio.length===6){
      const c1=p.audio.slice(0,3),c2=p.audio.slice(3,6);
      playchord(c1);flash(c1);
      setTimeout(()=>{playchord(c2);flash(c2);},900);
    }else if(p.type==='write'&&p.given&&p.given.length&&p.audio.length>1){
      pnote(freq(p.given[0]),0,.7);
      setTimeout(()=>{play(p.audio);flash(p.audio);},500);
    }else{play(p.audio);flash(p.audio);}
  },
  sa(pid,acc){if(ST[pid])ST[pid].sa=acc;rProbs();},
  nt(pid){
    const inp=document.getElementById('ni_'+pid);if(!inp)return;
    const p=ALL.find(x=>x.id===pid);if(!p)return;
    const s=ST[pid];if(!s)return;
    const parts=inp.value.trim().split(/[\s,]+/).filter(Boolean);
    if(!parts.length)return;
    s.pl=[];
    const gx=(p.givenX||80),gc=(p.given||[]).length;
    let vi=0;
    parts.forEach(nn=>{
      if(!pn(nn.trim()))return;
      s.pl.push({note:nn.trim(),acc:'',x:gx+gc*40+vi*40,color:'#2563eb',style:'whole'});
      vi++;
    });
    reIS(pid,s.cl,p.given||[],p.givenX||80);
    setActive(pid);inp.value='';
  },
  cl(pid){if(ST[pid])ST[pid].pl=[];rProbs();},
  _award(pid){
    const wasNew=!DONE[pid];
    DONE[pid]=true;
    if(wasNew){XP+=10;STREAK++;if(STREAK>BEST)BEST=STREAK;this._toast();}
    this.sp();rSB();
  },
  _miss(){STREAK=0;this.sp();rSB();},
  _toast(){
    if(STREAK>0&&STREAK%5===0){
      const t=document.getElementById('streaktoast');
      t.textContent=(LG==='ko'?`🔥 ${STREAK}연속 정답!`:`🔥 ${STREAK} in a row!`);
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'),1400);
    }
  },
  _showWhy(pid){const w=document.getElementById('why_'+pid);if(w)w.style.display='block';},
  _markSolved(pid){
    const box=document.getElementById('pb_'+pid);
    if(box)box.classList.add('solved');
  },
  ck(pid){
    const p=ALL.find(x=>x.id===pid);if(!p)return;
    const el=document.getElementById('ai_'+pid);
    const fb=document.getElementById('fb_'+pid);
    const ans=(el?el.value:'').trim();
    let ok=false;
    if(p.check)ok=p.check(ans);
    else{const a=ans.toLowerCase(),b=(p.ans||'').toLowerCase();ok=a===b||a.includes(b)||b.includes(a);}
    if(ok){
      const m=pick(CORRECT_MSGS);
      fb.className='fb fok';fb.textContent='✓ '+(LG==='ko'?m.ko:m.en);
      this._award(pid);this._showWhy(pid);
      this._markSolved(pid);
    }else{
      const m=pick(INCORRECT_MSGS);
      fb.className='fb fno';fb.textContent='✗ '+(LG==='ko'?m.ko:m.en)+' '+(p.showAns||p.ans||'');
      this._miss();
    }
  },
  cm(pid,ans,btn){
    const p=ALL.find(x=>x.id===pid);if(!p)return;
    const a1=ans.toLowerCase().trim(),a2=(p.ans||p.lbl||'').toLowerCase().trim();
    const ok=a1===a2||a1.includes(a2)||a2.includes(a1);
    btn.className='mo '+(ok?'ok':'bad');
    const fb=document.getElementById('fb_'+pid);
    if(ok){
      const m=pick(CORRECT_MSGS);
      fb.className='fb fok';fb.textContent='✓ '+(LG==='ko'?m.ko:m.en);
      this._award(pid);this._showWhy(pid);
      this._markSolved(pid);
    }else{
      const m=pick(INCORRECT_MSGS);
      fb.className='fb fno';fb.textContent='✗ '+(LG==='ko'?m.ko:m.en)+' '+(p.lbl||p.ans||'');
      this._miss();
    }
  },
  cw(pid){
    const s=ST[pid],p=ALL.find(x=>x.id===pid);if(!p||!s)return;
    const fb=document.getElementById('fb_'+pid);
    if(!s.pl.length){fb.className='fb fin';fb.textContent=LG==='ko'?'오선을 클릭해서 음표를 배치하세요.':'Click the staff to place notes.';return;}
    const pMid=s.pl.map(n=>{const full=n.note.slice(0,-1)+(n.acc||'')+n.note.slice(-1);return midi(full)||midi(n.note);}).filter(Boolean);
    const aMid=(p.ans||[]).map(n=>midi(n)).filter(Boolean);
    const gMid=(p.given||[]).map(n=>midi(n)).filter(Boolean);
    const need=aMid.filter(m=>!gMid.includes(m));
    const ok=need.length>0&&need.every(m=>pMid.includes(m));
    if(ok){
      const m=pick(CORRECT_MSGS);
      fb.className='fb fok';fb.textContent='✓ '+(LG==='ko'?m.ko:m.en);
      s.pl=s.pl.map(n=>({...n,color:'#16a34a'}));
      reIS(pid,s.cl,p.given,p.givenX);
      this._award(pid);this._showWhy(pid);
      play(p.ans||[]);flash(p.ans||[]);
      this._markSolved(pid);
    }else{
      const m=pick(INCORRECT_MSGS);
      fb.className='fb fno';fb.textContent='✗ '+(LG==='ko'?m.ko:m.en)+' '+(p.ans||[]).join(', ');
      s.pl=s.pl.map(n=>({...n,color:'#dc2626'}));
      reIS(pid,s.cl,p.given,p.givenX);
      this._miss();
    }
  },
  sh(pid){
    const p=ALL.find(x=>x.id===pid);if(!p)return;
    const fb=document.getElementById('fb_'+pid);
    fb.className='fb fin';fb.textContent=(LG==='ko'?'💡 정답: ':'💡 Answer: ')+(Array.isArray(p.ans)?p.ans.join(', '):p.ans||'');
  },
  csl(pid){
    const p=ALL.find(x=>x.id===pid);if(!p)return;
    const s=ST[pid];if(!s)return;
    const fb=document.getElementById('fb_'+pid);
    if(!s.sel||s.sel.size===0){fb.className='fb fin';fb.textContent=LG==='ko'?'음표를 클릭해서 선택하세요.':'Click notes to select.';return;}
    const ns=p.ns||s.ns||[];
    const selMidi=[...s.sel].map(i=>ns[i]).map(n=>midi(n)).filter(Boolean).sort((a,b)=>a-b);
    const ansMidi=(p.ansMidi||[]).slice().sort((a,b)=>a-b);
    const ok=selMidi.length===ansMidi.length&&selMidi.every((m,i)=>m===ansMidi[i]);
    if(ok){
      const m=pick(CORRECT_MSGS);
      fb.className='fb fok';fb.textContent='✓ '+(LG==='ko'?m.ko:m.en);
      this._award(pid);this._showWhy(pid);
      play(p.audio||[]);flash(p.audio||[]);
      this._markSolved(pid);
    }else{
      const m=pick(INCORRECT_MSGS);
      fb.className='fb fno';fb.textContent='✗ '+(LG==='ko'?m.ko:m.en)+' '+(p.ans||'');
      this._miss();
    }
  },
  clsl(pid){
    if(ST[pid])ST[pid].sel=new Set();
    const p=ALL.find(x=>x.id===pid);
    if(p)reSL(pid,p.ns||ST[pid].ns||[],(ST[pid]&&ST[pid].cl)||'treble');
  },
  micToggle(pid){
    const btn=document.getElementById('micbtn_'+pid);
    const st=document.getElementById('micstat_'+pid);
    if(MIC_STATE.active && MIC_STATE.pid===pid){
      micStop();
      if(btn)btn.textContent='🎤 '+(LG==='ko'?'듣기 시작':'Start listening');
      if(st)st.textContent='';
      return;
    }
    if(btn)btn.textContent='⏹ '+(LG==='ko'?'듣기 중지':'Stop listening');
    if(st)st.textContent=LG==='ko'?'마이크 권한을 확인해 주세요...':'Requesting microphone access...';
    micStart(pid,
      (name,avgFreq)=>{
        const p=ALL.find(x=>x.id===pid);if(!p)return;
        const s=ST[pid];if(!s)return;
        if(p.type==='write'){
          const gx=(p.givenX||80),gc=(p.given||[]).length;
          const nx=gx+gc*40+s.pl.length*40;
          s.pl.push({note:name,acc:'',x:nx,color:'#7a3b52',style:'whole'});
          reIS(pid,s.cl,p.given||[],p.givenX||80);
        }
        const stEl=document.getElementById('micstat_'+pid);
        if(stEl)stEl.textContent=(LG==='ko'?'✓ 입력됨: ':'✓ entered: ')+name;
        pnote(freq(name),0,.15);
      },
      (name,f)=>{
        const stEl=document.getElementById('micstat_'+pid);
        if(!stEl)return;
        if(name==='__ERROR__'){
          stEl.textContent=LG==='ko'?'⚠️ 마이크 접근 실패 (브라우저 권한을 확인하세요)':'⚠️ Mic access failed (check browser permissions)';
          const btnEl=document.getElementById('micbtn_'+pid);
          if(btnEl)btnEl.textContent='🎤 '+(LG==='ko'?'듣기 시작':'Start listening');
          return;
        }
        stEl.textContent=name?`🎧 ${name} (${f.toFixed(0)}Hz)`:(LG==='ko'?'... 소리를 들어보고 있어요':'... listening for a pitch');
      }
    );
  },
  sp(){try{localStorage.setItem('bhw3',JSON.stringify({DONE,XP,STREAK,BEST}));}catch(e){}},
  lp(){try{const d=JSON.parse(localStorage.getItem('bhw3')||localStorage.getItem('bhw2')||'{}');
    if(d.DONE)Object.assign(DONE,d.DONE);else Object.assign(DONE,d);
    XP=d.XP||0;STREAK=0;BEST=d.BEST||0;}catch(e){}},
};

document.addEventListener('DOMContentLoaded',()=>A.init());
</script>
</body>
</html>
