<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하모니 워크북 — 강좌 안으로 이사했습니다 · Harmony Workbook has moved</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f4f0;color:#2b2926;font:17px/1.7 system-ui,'Noto Sans KR',sans-serif;text-align:center}
  main{max-width:30rem;padding:2rem 1.25rem}
  h1{font-size:1.35rem;margin:0 0 .6rem}
  p{margin:.3rem 0;color:#5b5750}
  a{color:#20406b;font-weight:700}
  .links{margin-top:1.2rem;display:flex;flex-direction:column;gap:.5rem}
</style>
</head>
<body>
<main>
  <h1>하모니 워크북은 강좌 안으로 이사했습니다</h1>
  <p>Harmony Workbook has moved into the course.</p>
  <p id="msg">새 주소로 이동하는 중입니다… · Taking you there…</p>
  <div class="links">
    <a id="newlink" href="https://mowmau.github.io/harmony/#workbook">새 워크북으로 가기 · Go to the new workbook</a>
    <a href="legacy.html">예전 워크북 열기 · Open the previous workbook</a>
  </div>
  <p style="margin-top:1.2rem;font-size:.9rem">풀어 둔 문제와 점수는 그대로 이어집니다. · Your solved problems and score carry over.</p>
</main>
<script>
/* 새 사이트의 워크북이 실제로 열릴 때만 넘긴다(같은 도메인이라 확인 요청이 막히지 않는다).
   열리지 않으면(아직 배포 전이거나 장애) 예전 워크북(legacy.html)을 그대로 보여 준다 — 학생이 빈 화면을 보지 않게. */
(function(){
  var NEW = 'https://mowmau.github.io/harmony/#workbook';
  var PROBE = 'https://mowmau.github.io/harmony/workbook.css';
  var done = false;
  function go(url){ if(done) return; done = true; location.replace(url); }
  var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctl) ctl.abort(); go('legacy.html'); }, 4000);
  try {
    fetch(PROBE, {cache: 'no-store', signal: ctl ? ctl.signal : undefined}).then(function(r){
      clearTimeout(timer); go(r.ok ? NEW : 'legacy.html');
    }).catch(function(){ clearTimeout(timer); go('legacy.html'); });
  } catch(e) { clearTimeout(timer); go('legacy.html'); }
})();
</script>
<noscript><style>#msg{display:none}</style></noscript>
</body>
</html>
